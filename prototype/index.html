<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>롱잡고알바감</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e13;--panel:#161821;--panel2:#1e2130;--line:#2e3346;--fg:#eceef4;--mute:#9aa1b6;--dim:#6b7186;
  --pink:#ff8fb1;--green:#7ee0a8;--gold:#ffd166;--red:#ff4d5e;--blue:#4e8cff;--purple:#b98cff;
  --hfont:"Black Han Sans","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;max-width:100vw;background:#05060a;overflow:hidden;overscroll-behavior:none;color:var(--fg);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
#wrap{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#05060a}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
#main{position:absolute;left:0;top:0;width:1440px;height:1080px;overflow:hidden;background:#0b0c11}
#bg,#npcLayer,#charLayer,#fx,#dan{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#charLayer,#npcLayer{pointer-events:none}
#char{position:absolute;left:40px;top:250px;width:520px;height:780px;transition:opacity .35s,transform .35s,filter .6s}
#char svg,#npc svg{width:100%;height:100%;display:block}
#char.hide{opacity:0;transform:translateY(24px)}
#char.ash{filter:grayscale(1) brightness(2.4) contrast(.6);animation:ashfall 2.4s ease-in forwards}
@keyframes ashfall{0%{opacity:1}55%{opacity:1;transform:none}100%{opacity:.15;transform:translateY(40px) scaleY(.92);filter:grayscale(1) brightness(3) blur(6px)}}
#char.bounce{animation:cbounce .5s ease-out}
@keyframes cbounce{40%{transform:translateY(-26px)}}
#npc{position:absolute;left:880px;top:230px;width:500px;height:780px;transition:opacity .35s,transform .35s}
#npc.hide{opacity:0;transform:translateX(60px)}
#bubble{position:absolute;left:70px;top:178px;max-width:520px;z-index:22;background:#fff;color:#1a1a1a;border-radius:22px;padding:14px 22px;font-size:25px;font-weight:700;line-height:1.4;
  box-shadow:0 10px 30px rgba(0,0,0,.45);word-break:keep-all;display:none}
#bubble.on{display:block;animation:pop .25s ease-out}
#bubble::after{content:"";position:absolute;left:120px;bottom:-16px;border:10px solid transparent;border-top:10px solid #fff;border-width:16px 12px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}}
/* HUD */
#hud{position:absolute;left:0;top:0;right:0;height:156px;display:flex;align-items:stretch;gap:14px;padding:14px 20px;
  background:linear-gradient(180deg,rgba(6,7,10,.96),rgba(6,7,10,.86) 75%,rgba(6,7,10,0));z-index:20}
#hud.off{display:none}
.hb{background:rgba(22,24,33,.92);border:1px solid var(--line);border-radius:18px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center}
.hb .l{font-size:16px;color:var(--mute);font-weight:700;letter-spacing:.5px}
#hDebt{width:370px;border-color:#ff4d5e77;background:linear-gradient(180deg,rgba(60,10,18,.92),rgba(30,8,12,.92))}
#hDebt .v{font-family:var(--hfont);font-size:54px;line-height:1.05;color:var(--red);letter-spacing:-1px;text-shadow:0 0 18px rgba(255,77,94,.35);white-space:nowrap}
#hCash{width:250px}
#hCash .v{font-family:var(--hfont);font-size:34px;color:var(--green);white-space:nowrap}
#hCash .s{font-size:16px;color:#ffb3bb;margin-top:4px;white-space:nowrap}
#hDay{width:220px}
#hDay .v{font-size:25px;font-weight:900;white-space:nowrap}
#hDay .dd{font-family:var(--hfont);font-size:30px;color:var(--gold);white-space:nowrap}
#hAff{width:330px;padding:8px 12px;position:relative}
#hAff .l{display:flex;justify-content:space-between}
#hAff .l b{color:var(--pink);font-size:18px}
#affCv{width:306px;height:92px;display:block;margin-top:2px}
#hMent{width:120px;align-items:center;text-align:center;padding:8px}
#hMent .ic{font-size:40px;line-height:1}
#hMent .t{font-weight:900;font-size:21px;margin-top:4px}
#hMent.calm .t{color:var(--green)}#hMent.anx .t{color:var(--gold)}
#hMent.men{border-color:var(--purple);animation:menpulse 1s infinite}#hMent.men .t{color:var(--purple)}
@keyframes menpulse{50%{box-shadow:0 0 22px #b98cff99}}
#menuBtn{width:48px;border-radius:14px;border:1px solid var(--line);background:rgba(22,24,33,.92);font-size:24px;cursor:pointer;padding:0}
/* dialog */
#dlg{position:absolute;left:36px;right:36px;bottom:24px;height:206px;background:linear-gradient(180deg,rgba(18,20,29,.95),rgba(12,13,19,.98));
  border:1px solid #3a4058;border-radius:22px;padding:32px 44px 20px;z-index:30;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dlg.off{display:none}
#dlg .name{position:absolute;left:34px;top:-24px;font-weight:900;font-size:24px;padding:5px 24px;border-radius:14px;background:#2a2f44;border:1px solid #454c69}
#dlg .name.m{background:#5a2b40;border-color:#ff8fb1aa;color:#ffd6e3}
#dlg .name.me{background:#24375e;border-color:#7aa7ffaa;color:#d9e6ff}
#dlg .name.kim{background:#4a3a12;border-color:#ffd166aa;color:#ffe9b0}
#dlg .name.hide{display:none}
#dlg .text{font-size:32px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}
#dlg .text.nar{color:#c6cbe0;font-style:italic}
#dlg .next{position:absolute;right:30px;bottom:16px;font-size:20px;color:var(--mute);animation:bob 1s infinite}
#dlg .next.off{visibility:hidden}
@keyframes bob{50%{transform:translateY(5px)}}
#choices{position:absolute;left:640px;top:250px;width:760px;display:flex;flex-direction:column;gap:14px;z-index:64}
#main.kimOn #choices{left:900px;width:510px}
#main.kimOn:has(#choices button) #npc{left:520px;width:420px;height:660px;top:300px}
#choices button{width:100%;min-height:76px;font-size:26px;padding:14px 28px;border-radius:18px;border:1px solid #4a5170;
  background:linear-gradient(180deg,#262a3e,#1a1d2b);cursor:pointer;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s,border-color .12s;font-weight:700}
#choices button:hover{transform:translateX(8px);border-color:var(--gold)}
#choices button:disabled{opacity:1;color:#5b6178;background:#14161f;border-color:#262a3a;cursor:default;transform:none}#choices button:disabled .k{color:#5b6178}
#choices button .k{display:inline-block;width:36px;color:var(--gold);font-weight:900}
#choices button small{display:block;font-size:19px;color:var(--mute);margin-left:36px;font-weight:400}
/* panel (cards, games) */
#panel{position:absolute;left:600px;top:170px;width:816px;height:660px;z-index:25;display:none;background:rgba(14,16,23,.95);border:1px solid #3a4058;border-radius:26px;padding:26px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#panel.on{display:block}
#panel.wide{left:24px;width:1392px}
#panel h2{margin:0 0 4px;font-size:38px;font-family:var(--hfont);font-weight:400;letter-spacing:-.5px}
#panel .sub{font-size:19px;color:var(--mute);margin-bottom:16px;line-height:1.45}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{position:relative;border:1px solid #3e4563;border-radius:20px;padding:18px 20px 16px;background:linear-gradient(180deg,#20243a,#191c2b);cursor:pointer;text-align:left;min-height:226px;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card:disabled{opacity:.4;cursor:default;transform:none}
.card .k{position:absolute;right:16px;top:12px;font-size:20px;color:var(--gold);font-weight:900}
.card .ic{font-size:50px;line-height:1}
.card b{font-size:29px;margin-top:8px;font-weight:900}
.card .d{font-size:18px;color:#c9cee0;margin-top:6px;line-height:1.45;flex:1}
.card .r{font-size:16px;margin-top:8px;color:var(--mute)}
.card .r i{font-style:normal;padding:2px 10px;border-radius:999px;border:1px solid var(--line);margin-right:6px}
.card .r i.lo{color:var(--green);border-color:#7ee0a866}.card .r i.mid{color:var(--gold);border-color:#ffd16666}.card .r i.hi{color:var(--red);border-color:#ff4d5e88}
.btn{border:1px solid #4a5170;background:linear-gradient(180deg,#2a2f45,#1f2334);border-radius:16px;padding:14px 30px;font-size:24px;cursor:pointer;font-weight:900}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,#ffd166,#f2b443);color:#1a1405;border-color:#ffd166}
.btn.red{background:linear-gradient(180deg,#ff5d6c,#c8303f);color:#fff;border-color:#ff8a95}
.btn.sm{font-size:18px;padding:8px 16px;border-radius:12px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stake{background:#141722;border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:14px}
.stake .amt{font-family:var(--hfont);font-size:40px;color:var(--gold);min-width:250px}
.stake input[type=range]{width:100%;margin:8px 0 4px;accent-color:#ffd166;height:28px}
.stake .loan{margin-left:auto}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-size:22px;padding:12px 8px;border-radius:14px;border:1px solid #4a5170;background:#1b1f2e;cursor:pointer;font-weight:900}
.seg button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.seg button.long.on{background:#ff4d5e;color:#fff;border-color:#ff4d5e}
.seg button.short.on{background:#4e8cff;color:#fff;border-color:#4e8cff}
.gArea{position:relative;height:300px;border-radius:20px;background:#0f1118;border:1px solid #2a3042;overflow:hidden;display:flex;align-items:center;justify-content:center}
.res{font-family:var(--hfont);font-size:46px;text-align:center;min-height:56px;margin-top:12px}
.res.win{color:var(--red)}.res.lose{color:var(--blue)}
.gag{font-size:20px;color:var(--mute);text-align:center;margin-top:2px;min-height:28px}
/* odd-even */
.bowl{width:260px;height:150px;border-radius:0 0 130px 130px;background:linear-gradient(180deg,#7a5232,#4a2f1c);position:relative;box-shadow:inset 0 10px 0 #9a6a42}
.bowl.shake{animation:bowl .18s linear infinite}
@keyframes bowl{25%{transform:rotate(-8deg) translateX(-10px)}75%{transform:rotate(8deg) translateX(10px)}}
.beads{position:absolute;left:0;right:0;bottom:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 90px}
.beads i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d8d8e8 55%,#9aa0b8);box-shadow:0 2px 4px #000a}
/* slot */
.reels{display:flex;gap:16px}
.reel{width:170px;height:200px;border-radius:18px;background:linear-gradient(180deg,#fff,#e6e6ef 50%,#fff);color:#111;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:inset 0 0 24px #0005;border:6px solid #ffd166}
.reel.spin{animation:rspin .09s linear infinite}
@keyframes rspin{50%{transform:translateY(8px);filter:blur(2px)}}
/* chart */
#iCv{width:756px;height:300px;display:block;border-radius:16px;background:#0d0f16}
.pnlBig{font-family:var(--hfont);font-size:64px;line-height:1;text-align:right;white-space:nowrap}
.pnlBig.up{color:var(--red)}.pnlBig.dn{color:var(--blue)}
/* minigames */
.mgBar{position:relative;height:70px;border-radius:16px;background:#2a1d24;overflow:hidden;border:1px solid #444c66}
.mgBar .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#2f6b4c,#3f9467)}
.mgBar .needle{position:absolute;top:-4px;bottom:-4px;width:10px;background:#fff;border-radius:4px;box-shadow:0 0 14px #fff}
.timer{height:12px;border-radius:6px;background:#22263a;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#7ee0a8,#ffd166,#ff4d5e);width:100%}
.order{font-size:30px;font-weight:900;text-align:center;padding:12px;border-radius:16px;background:#221d14;border:1px solid #ffd16655}
.tray{min-height:64px;font-size:40px;text-align:center;margin:10px 0;letter-spacing:4px}
.drinks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.drinks button{font-size:24px;padding:16px 6px;border-radius:16px;border:1px solid #4a5170;background:#1d2131;cursor:pointer;font-weight:900}
.drinks button span{display:block;font-size:44px}
.mash{width:100%;height:190px;border-radius:24px;font-size:40px;font-weight:900;border:2px solid #ffd166;background:linear-gradient(180deg,#5a3b1c,#3a2610);cursor:pointer}
.mash:active{transform:scale(.97)}
.boxes{font-size:30px;text-align:center;letter-spacing:2px;min-height:44px;margin-top:10px;word-break:break-all}
/* shop */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border:1px solid #3e4563;border-radius:16px;padding:10px 12px 10px 64px;background:#1b1f2e;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative;min-height:112px}
.item:hover{border-color:var(--gold)}
.item:disabled{opacity:.4;cursor:default}
.item .ic{font-size:36px;position:absolute;left:14px;top:14px}
.item b{font-size:19px}
.item .p{font-size:20px;color:var(--gold);font-weight:900}
.item .d{font-size:14px;color:var(--mute);line-height:1.3}
.item.own{border-color:#7ee0a8aa;background:#17261e}
.item.own .p{color:var(--green)}
/* phone */
#phoneCol{position:absolute;left:1440px;top:0;width:480px;height:1080px;background:radial-gradient(circle at 50% 30%,#1a1d2a,#0c0d12);border-left:1px solid #1f2230}
#phone{position:absolute;left:24px;top:24px;width:432px;height:1032px;border-radius:52px;background:#050608;border:2px solid #2d3245;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 8px #0b0c10;padding:14px}
#phone.buzz{animation:buzz .08s linear 14}
@keyframes buzz{50%{transform:translate(-5px,2px) rotate(-.6deg)}}
#phoneIn{position:absolute;inset:14px;border-radius:40px;background:#11131b;overflow:hidden;display:flex;flex-direction:column}
#pStatus{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:16px;font-weight:700;color:#d8dbe8;flex:none}
#pStatus .isl{width:100px;height:28px;border-radius:999px;background:#000}
.pane{display:flex;flex-direction:column;min-height:0}
#kPane{flex:1.1;border-bottom:6px solid #07080c}
#gPane{flex:1;background:#f3f4f7;color:#1d1f27}
.pane .hd{padding:8px 18px 8px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;flex:none}
.pane .hd small{font-size:13px;color:var(--mute);font-weight:500;margin-left:auto}
#gPane .hd{background:#3b4890;color:#fff}
#gPane .hd small{color:#cdd3ff}
.pane .sc{flex:1;overflow:hidden;padding:4px 14px 10px;display:flex;flex-direction:column;justify-content:flex-end}
.bub{max-width:82%;margin:4px 0;display:flex;gap:6px;align-items:flex-end;flex:none}
.bub .b{padding:8px 13px;border-radius:16px;font-size:16.5px;line-height:1.4;word-break:keep-all}
.bub.m .b{background:#262a3a;border-top-left-radius:5px}
.bub.me{margin-left:auto;flex-direction:row-reverse}
.bub.me .b{background:#ffd166;color:#1d1605;border-top-right-radius:5px}
.bub.kim .b{background:#3a2f12;color:#ffe9b0;border:1px solid #ffd16655}
.bub.sys{max-width:100%;justify-content:center}.bub.sys .b{background:none;color:var(--dim);font-size:13px;padding:2px}
.bub.new{animation:tin .25s ease-out}
.gp{border-bottom:1px solid #dde0e8;padding:6px 2px;font-size:15.5px;line-height:1.4;flex:none;word-break:keep-all}
.gp .n{font-weight:900;color:#3b4890;margin-right:6px;font-size:14px}
.gp .n.ip{color:#777}
.gp .u{float:right;color:#d33;font-size:13px;font-weight:700}
.gp.new{animation:gin .5s ease-out}
@keyframes gin{from{background:#fff3b0}}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* screens */
#screen{position:absolute;left:0;top:156px;width:1440px;height:924px;z-index:24;display:none}
#screen.on{display:block}
.recap{position:absolute;left:70px;right:70px;top:20px;bottom:40px;padding:34px 44px;background:rgba(14,16,23,.95);border:1px solid #3a4058;border-radius:26px;overflow:hidden}
.recap h2{margin:0;font-size:46px;font-family:var(--hfont);font-weight:400}
.recap .sub{color:var(--mute);font-size:21px;margin:4px 0 18px}
.recap .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.recap h3{font-size:20px;color:var(--gold);margin:0 0 8px;letter-spacing:1px}
.recap .li{font-size:23px;line-height:1.6;display:flex;justify-content:space-between;border-bottom:1px dashed #2a3042;padding:3px 0}
.recap .net{font-family:var(--hfont);font-size:52px;margin-top:10px}
.recap .conv{font-size:26px;color:#ffd6e3;margin-top:4px;font-weight:700}
.recap .box{background:#1a1d29;border-radius:16px;padding:14px 18px;font-size:21px;line-height:1.55;margin-bottom:14px}
.recap .ev{background:#221d14;border:1px solid #ffd16655;border-radius:16px;padding:14px 18px;font-size:22px;line-height:1.5;margin-bottom:14px}
.up{color:var(--red)}.dn{color:var(--blue)}
/* fx */
#fx{z-index:60;pointer-events:none;overflow:hidden}
.bigfx{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:var(--hfont);font-size:150px;letter-spacing:-3px;animation:bigin 1.9s ease-out forwards;text-shadow:0 8px 30px #000}
.bigfx.up{color:#ff3b4f;-webkit-text-stroke:3px #fff}
.bigfx.dn{color:#3f7dff;-webkit-text-stroke:3px #fff}
.bigfx small{display:block;font-size:44px;letter-spacing:0;-webkit-text-stroke:0;color:#fff}
@keyframes bigin{0%{transform:scale(2.4);opacity:0}15%{transform:scale(.95);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.aurora{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,59,79,.0),rgba(255,59,79,.35),rgba(255,209,102,.35),rgba(126,224,168,.3),rgba(185,140,255,.35),rgba(255,59,79,0));background-size:300% 100%;animation:aur 1.8s linear forwards}
@keyframes aur{0%{background-position:0 0;opacity:0}20%{opacity:1}100%{background-position:100% 0;opacity:0}}
.gloom{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0),rgba(10,30,90,.75));animation:fade 1.9s forwards}
@keyframes fade{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.conf{position:absolute;top:-40px;font-size:40px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(1180px) rotate(540deg)}}
.crack{position:absolute;inset:0;animation:crk 2.2s forwards}
.crack svg{width:100%;height:100%}
@keyframes crk{0%{opacity:0}5%{opacity:1}80%{opacity:1}100%{opacity:0}}
.redflash{position:absolute;inset:0;background:rgba(255,30,50,.35);animation:fade .8s forwards}
.whiteflash{position:absolute;inset:0;background:#fff;animation:fade 1.4s forwards}
.dust{position:absolute;width:10px;height:10px;border-radius:50%;background:#eee;animation:dust 2.4s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.float{position:absolute;z-index:61;font-size:30px;font-weight:900;pointer-events:none;animation:fup 1.6s ease-out forwards;text-shadow:0 2px 10px #000;white-space:nowrap}
@keyframes fup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px)}}
.shake{animation:shk .5s linear 2}
@keyframes shk{20%{transform:translate(-10px,3px)}40%{transform:translate(10px,-3px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,0)}}
#dan{z-index:58;pointer-events:none;overflow:hidden}
.dm{position:absolute;left:1440px;white-space:nowrap;font-size:34px;font-weight:900;color:#fff;background:rgba(40,20,60,.85);border:2px solid #b98cff;border-radius:999px;padding:6px 22px;animation:dmv linear forwards}
@keyframes dmv{to{transform:translateX(-2200px)}}

function parseCsv(text) {
  const lines = String(text).trim().split(/\r?\n/).filter(l => l.trim());
  const head = lines.shift().split(",").map(h => h.trim().toLowerCase());
  const col = names => head.findIndex(h => names.includes(h));
  const iDt = col(["datetime", "timestamp", "time", "date"]), iO = col(["open", "o"]), iH = col(["high", "h"]), iL = col(["low", "l"]), iC = col(["close", "c"]);
  if (iDt < 0 || iO < 0 || iH < 0 || iL < 0 || iC < 0) throw new Error("CSV 헤더에 datetime,open,high,low,close 가 필요합니다");
  const out = [];
  for (const ln of lines) {
    const p = ln.split(",");
    const o = +p[iO], h = +p[iH], l = +p[iL], c = +p[iC];
    if (!isFinite(o) || !isFinite(c)) continue;
    out.push({ dt: p[iDt].trim(), o, h, l, c });
  }
  return out;
}

function makeWindow(mk) {

  if (rows.length > WIN + 1) {
    const st = Math.floor(rnd() * (rows.length - WIN - 1));
    bars = rows.slice(st, st + WIN).map(r => ({ o: r.o, h: r.h, l: r.l, c: r.c, dt: r.dt }));
  } else bars = Array.from({ length: WIN }, (_, i) => ({ o: 100, h: 100.1, l: 99.9, c: 100, dt: "" + i }));
  const p0 = bars[0].o, flip = rnd() < 0.5 ? -1 : 1, A = m.amp;
  const tr = v => m.k * p0 * (1 + flip * A * (v / p0 - 1));
  bars = bars.map(b => { const o = tr(b.o), c = tr(b.c), x = tr(b.h), y = tr(b.l); return { o, c, h: Math.max(x, y, o, c), l: Math.min(x, y, o, c), dt: b.dt }; });

}

function drawAff() {
  const cv = $("#affCv"); if (!cv) return;

  ctx.clearRect(0, 0, Wd, Ht);

  let lo = Math.min(...cs.map(c => c.l), S.aff), hi = Math.max(...cs.map(c => c.h), S.aff);
  const mid = (lo + hi) / 2, half = Math.max(12, (hi - lo) / 2 + 4); lo = Math.max(0, mid - half); hi = Math.min(100, mid + half);
  if (hi - lo < 24) { if (lo === 0) hi = 24; else lo = hi - 24; }
  const Y = v => 10 + (hi - v) / (hi - lo) * (Ht - 20);
  ctx.strokeStyle = "#262a3a"; ctx.lineWidth = 2; ctx.fillStyle = "#5b6178"; ctx.font = "18px ui-monospace,Menlo,monospace";
  [hi, (hi + lo) / 2, lo].forEach(v => { ctx.beginPath(); ctx.moveTo(0, Y(v)); ctx.lineTo(Wd - 40, Y(v)); ctx.stroke(); ctx.fillText(Math.round(v), Wd - 36, Y(v) + 6); });
  const cw = (Wd - 44) / N;
  cs.forEach((c, k) => {
    const x = k * cw + cw / 2, up = c.c >= c.o, col = up ? "#ff4d5e" : "#4e8cff";

  });
}

function drawInv(cv, w, upto, pos) {
  const ctx = cv.getContext("2d"), Wd = cv.width, Ht = cv.height, bars = w.bars, m = MKT[w.mk];
  const padL = 14, padR = 150, padT = 20, padB = 20;
  ctx.fillStyle = "#0d0f16"; ctx.fillRect(0, 0, Wd, Ht);
  const vis = bars.slice(0, upto + 1);
  let lo = Math.min(...vis.map(b => b.l)), hi = Math.max(...vis.map(b => b.h));
  const lines = [];
  if (pos) { lines.push({ y: pos.entry, c: "#ffd166", l: "진입" }); if (pos.liqPx) lines.push({ y: pos.liqPx, c: "#ff3b4f", l: "청산가" }); }
  lines.forEach(L => { lo = Math.min(lo, L.y); hi = Math.max(hi, L.y); });
  const span = Math.max(hi - lo, bars[0].o * 0.004); const mid = (hi + lo) / 2; lo = mid - span * .56; hi = mid + span * .56;
  const Y = v => padT + (hi - v) / (hi - lo) * (Ht - padT - padB), cw = (Wd - padL - padR) / bars.length;
  ctx.strokeStyle = "#1c2030"; ctx.lineWidth = 2; ctx.fillStyle = "#6b7186"; ctx.font = "20px ui-monospace,Menlo,monospace";
  for (let k = 0; k <= 4; k++) { const y = padT + k * (Ht - padT - padB) / 4; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(Wd - padR, y); ctx.stroke(); ctx.fillText((hi - k * (hi - lo) / 4).toFixed(m.dec), Wd - padR + 8, y + 7); }
  vis.forEach((b, k) => {
    const x = padL + k * cw + cw / 2, col = b.c >= b.o ? "#ff4d5e" : "#4e8cff";
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, Y(b.h)); ctx.lineTo(x, Y(b.l)); ctx.stroke();
    const y1 = Y(Math.max(b.o, b.c)), y2 = Y(Math.min(b.o, b.c)); ctx.fillRect(x - cw * .36, y1, cw * .72, Math.max(2, y2 - y1));
  });
  lines.forEach(L => { ctx.strokeStyle = L.c; ctx.lineWidth = 3; ctx.setLineDash([12, 8]); ctx.beginPath(); ctx.moveTo(padL, Y(L.y)); ctx.lineTo(Wd - padR, Y(L.y)); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = L.c; ctx.font = "bold 22px 'Noto Sans KR',sans-serif"; ctx.fillText(L.l, padL + 8, Y(L.y) - 8); });
  const lc = vis[vis.length - 1].c; ctx.fillStyle = "#e8eaf2"; ctx.fillRect(Wd - padR + 2, Y(lc) - 16, padR - 4, 32); ctx.fillStyle = "#111"; ctx.font = "bold 20px ui-monospace,Menlo,monospace"; ctx.fillText(lc.toFixed(m.dec), Wd - padR + 8, Y(lc) + 7);
}

async function runFrom(phase) {
  for (; ;) {
    if (phase === "morning") { await morning(); phase = "day"; }
    if (phase === "day") { if (await dayTurn()) return; phase = "night"; }
    if (phase === "night") { if (await nightTurn()) return; phase = S.day >= MONTH_DAYS ? "payday" : "next"; }
    if (phase === "payday") { if (await payday()) return; phase = "next"; }
    if (phase === "next") {
      S.yday = S.today; S.today = [];
      S.day++; if (S.day > MONTH_DAYS) { S.day = 1; S.month++; }
      phase = "morning";
    }
  }
}

        <div>알바 / 도박 / 투자<b>${S.st.work} / ${S.st.gamble} / ${S.st.invest}</b></div><div>청산<b>${S.st.liq}회</b></div><div>꾸미기 지출<b>${won(S.st.decor)}</b></div><div>멘헤라 받아치기<b>${S.st.menOk}승 ${S.st.menBad}패</b></div></div>
      <div class="row"><button class="btn pri" id="again" data-bot="again">새 게임 (Enter)</button><span style="font-size:18px;color:var(--mute)">호감도 ${S.aff} · 갤 화제성 ${S.galFame} · 시드 ${S.seed}</span></div>
      <div class="disc">※ 이 게임은 도박·투자 권유가 아닙니다. 차트는 합성·샘플 데이터이고 등장인물·업체·커뮤니티는 전부 가상입니다.<br>현실의 사채·도박·고배율 선물은 진짜로 원양어선입니다.</div></div></div>`;
  $("#again").onclick = e => { e.stopPropagation(); clearSave(); location.href = location.pathname + location.search; };
}

/* ================= 타이틀 ================= */
function showTitle() {
  const f = $("#full"); f.classList.add("on");
  const sv = loadSave();
  f.innerHTML = `<div class="title"><div class="ticker"><span>[속보] 주식갤 고닉 「롱잡고알바감」 빚 3천 고백 ▲ 김사장 캐피탈 금리 동결 (월 5%) ▲ 비트코인 오늘도 위아래로 흔듦 ▲ 원양어선 선원 상시 모집 ▲ 형 나 믿지? ▲ 이 게임은 도박·투자 권유가 아닙니다 ▲</span></div>
    <div class="tchar">${miraeSVG("smug")}</div><div class="stamp">빚 3,000만</div>
    <div class="tx"><h1>롱잡고알바감</h1><div class="tg">~빚 3천 갚기 전엔 못 헤어져~</div>
    <div class="tg2">여친이 100일 기념으로 빚을 고백했다. 사채업자가 문을 두드린다.<br>알바냐, 도박이냐, 50배냐. 한 달(10일)마다 이자일이 온다.</div>
    <div class="acts"><button class="btn pri" id="newG" data-bot="newG" style="font-size:30px;padding:18px 44px">새 게임 (Enter)</button>${sv && sv.phase !== "ending" ? `<button class="btn" id="contG" data-bot="contG" style="font-size:26px">이어하기 · ${sv.month}개월차 ${sv.day}일째 ${({ morning: "아침", day: "낮", night: "밤", payday: "이자일" })[sv.phase] || ""}</button>` : ""}</div></div>
    <div class="note">컨셉 프로토타입 · 5~10분 (한 달 = 10일, 최대 3개월) · 클릭/Space/Enter = 진행 · 숫자키 = 선택 · D = 디버그<br>이 게임은 도박·투자 권유가 아닙니다. 차트는 샘플 데이터 · 등장인물·업체는 가상입니다.</div></div>`;
  $("#newG").onclick = e => { e.stopPropagation(); clearSave(); f.classList.remove("on"); f.innerHTML = ""; opening(); };
  if ($("#contG")) $("#contG").onclick = e => { e.stopPropagation(); f.classList.remove("on"); f.innerHTML = ""; resume(sv); };
}
function resume(sv) {
  S = sv; fxSeed = (S.seed ^ S.rng) | 0;
  renderKakao(); renderGal(); updHud();
  pushK("sys", "이어하기");
  runFrom(S.phase === "ending" ? "morning" : S.phase || "morning");
}

/* ================= 입력 ================= */
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("button"); if (b) b.blur(); }, true);
$("#main").addEventListener("click", e => { if (e.target.closest("button,#panel,#screen,input")) return; advance(); });
document.addEventListener("keydown", e => {
  const q = s => document.querySelector(s), go = e.key === " " || e.key === "Enter", num = /^[0-9]$/.test(e.key) ? +e.key - 1 : -1;
  if (e.key === "d" || e.key === "D") { dbgOn = !dbgOn; updDebug(); return; }
  if (e.repeat && go) { e.preventDefault(); return; }
  if (go || num >= -1 && /^[0-9]$/.test(e.key)) e.preventDefault();
  if (q("#modal.on")) { if (go) { const b = q("#modal .btn.pri") || q("#modal .btn"); if (b) b.click(); } return; }
  if (keyHook && keyHook(e)) return;
  if (q("#full.on")) { if (go) { const b = q("#full #again") || q("#full #newG"); if (b) b.click(); } return; }
  if (chooseWait && !modalOpen) { if (num >= 0) chooseWait(num); return; }
  if (q("#screen.on")) { if (go) { const b = q("#screen .btn.pri"); if (b) b.click(); } return; }
  if (q("#panel.on")) {
    if (num >= 0) { const c = q(`#panel [data-pick="${num}"]`); if (c) c.click(); return; }
    if (go) { const b = [...document.querySelectorAll("#panel .btn.pri")].find(x => !x.disabled); if (b) b.click(); }
    return;
  }
  if (go) advance();
});
fit();
window.__G = { get S() { return S; }, waiting: () => !!advWait || !!typing, ROWS, makeWindow, ending };
showTitle();

</script>
