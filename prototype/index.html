<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>롱잡고알바감</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e13;--panel:#161821;--panel2:#1e2130;--line:#2e3346;--fg:#eceef4;--mute:#9aa1b6;--dim:#6b7186;
  --pink:#ff8fb1;--green:#7ee0a8;--gold:#ffd166;--red:#ff4d5e;--blue:#4e8cff;--purple:#b98cff;
  --hfont:"Black Han Sans","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;max-width:100vw;background:#05060a;overflow:hidden;overscroll-behavior:none;color:var(--fg);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
#wrap{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#05060a}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
#main{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0b0c11}
#bg,#npcLayer,#charLayer,#fx,#dan{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#charLayer,#npcLayer{pointer-events:none}
#char{position:absolute;left:200px;top:250px;width:520px;height:780px;transition:opacity .35s,transform .35s,filter .6s}
#char svg,#npc svg{width:100%;height:100%;display:block}
#char.hide{opacity:0;transform:translateY(24px)}
#char.ash{filter:grayscale(1) brightness(2.4) contrast(.6);animation:ashfall 2.4s ease-in forwards}
@keyframes ashfall{0%{opacity:1}55%{opacity:1;transform:none}100%{opacity:.15;transform:translateY(40px) scaleY(.92);filter:grayscale(1) brightness(3) blur(6px)}}
#char.bounce{animation:cbounce .5s ease-out}
@keyframes cbounce{40%{transform:translateY(-26px)}}
#npc{position:absolute;left:1060px;top:230px;width:500px;height:780px;transition:opacity .35s,transform .35s}
#main[data-mode=home] #char{left:330px;top:190px;width:580px;height:870px}
#main[data-mode=loc] #char{left:150px;top:330px;width:420px;height:630px}
#main[data-mode=loc] #npc{left:640px;top:230px;width:500px;height:750px}
#main[data-mode=loc] #bubble{left:170px;top:270px}
#main[data-mode=home] #bubble{left:330px;top:150px}
#main.pOn #npc{opacity:0}
#main[data-mode=map] #char{display:none}
#npc.hide{opacity:0;transform:translateX(60px)}
#bubble{position:absolute;left:250px;top:150px;max-width:520px;z-index:22;background:#fff;color:#1a1a1a;border-radius:22px;padding:14px 22px;font-size:25px;font-weight:700;line-height:1.4;
  box-shadow:0 10px 30px rgba(0,0,0,.45);word-break:keep-all;display:none}
#bubble.on{display:block;animation:pop .25s ease-out}
#bubble::after{content:"";position:absolute;left:120px;bottom:-16px;border:10px solid transparent;border-top:10px solid #fff;border-width:16px 12px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}}
/* HUD (v3.2: 한 줄 슬림) */
#hud{position:absolute;left:0;top:0;right:0;height:84px;display:flex;align-items:center;gap:10px;padding:8px 16px;
  background:linear-gradient(180deg,rgba(6,7,10,.95),rgba(6,7,10,.82) 80%,rgba(6,7,10,0));z-index:40}
#hud.off{display:none}
.hb{height:64px;background:rgba(22,24,33,.9);border:1px solid var(--line);border-radius:14px;padding:5px 14px;display:flex;flex-direction:column;justify-content:center;flex:none;position:relative}
.hb .l{font-size:14px;color:var(--mute);font-weight:700;white-space:nowrap;line-height:1.2}
.hb .l i{font-style:normal;color:#ffd6a0;margin-left:4px}
.hb .v{font-size:25px;font-weight:900;white-space:nowrap;line-height:1.2}
#hDebt{border-color:#ff4d5e77;background:linear-gradient(180deg,rgba(60,10,18,.92),rgba(30,8,12,.92))}
#hDebt .v{font-family:var(--hfont);font-weight:400;font-size:33px;color:var(--red);letter-spacing:-.5px;text-shadow:0 0 14px rgba(255,77,94,.35)}
#hCash .v{font-family:var(--hfont);font-weight:400;font-size:29px;color:var(--green)}
#hDay .v{font-size:23px;display:flex;align-items:center;gap:8px}
.pips{display:inline-flex;gap:4px}.pips i{width:11px;height:11px;border-radius:50%;background:#2e3346;display:block}.pips i.u{background:#5b6178}.pips i.c{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#hDue .v{font-family:var(--hfont);font-weight:400;font-size:28px;color:var(--gold)}
#hDue.warn{border-color:#ff4d5e;animation:menpulse 1.2s infinite}#hDue.warn .v{color:#ff6b7a}
#hDue.ok .v{color:var(--green);font-size:22px;font-family:inherit;font-weight:900}
#hHp{width:250px}
#hHp .v{display:flex;align-items:center;gap:10px}
.hpbar{flex:1;height:18px;border-radius:9px;background:#2a2e40;overflow:hidden;border:1px solid #3a4058}
.hpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3ecf8e,#7ee0a8);transition:width .5s}
#hHp.mid .hpbar i{background:linear-gradient(90deg,#e0b23e,#ffd166)}
#hHp.low .hpbar i,#hHp.out .hpbar i{background:linear-gradient(90deg,#d9363e,#ff6b7a)}
#hHp.low,#hHp.out{border-color:#d9363e;animation:menpulse 1.2s infinite}
#hHp .hpn{font-size:24px;min-width:44px;text-align:right}
#hHp.faint{opacity:.6}
#hHp.ping,#hHp.ping .hpbar{animation:hpping .5s}
@keyframes hpping{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
#hMent .l i.add{font-style:normal;font-weight:900;margin-left:4px;padding:0 6px;border-radius:8px}
#hMent .l i.a1{color:#ffd166}#hMent .l i.a2{color:#fff;background:#b3261e}#hMent .l i.a3{color:#fff;background:#b3261e;animation:menpulse .7s infinite}
#affCv{width:130px;height:48px;display:block}
#hMent .v{font-size:21px}
#hMent.calm .v{color:var(--green)}#hMent.anx .v{color:var(--gold)}
#hMent.men{border-color:var(--purple);animation:menpulse 1s infinite}#hMent.men .v{color:var(--purple)}
@keyframes menpulse{50%{box-shadow:0 0 22px #b98cff99}}
.hsp{flex:1}
#menuBtn{width:54px;height:64px;border-radius:14px;border:1px solid var(--line);background:rgba(22,24,33,.92);font-size:26px;cursor:pointer;padding:0;flex:none}
#phoneBtn{position:relative;height:64px;min-width:210px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;border:2px solid #ff8fb1aa;background:linear-gradient(180deg,#3a1d30,#22121d);cursor:pointer;flex:none;box-shadow:0 0 18px #ff8fb133}
#phoneBtn:hover{border-color:var(--gold)}
#phoneBtn:disabled{opacity:.45;cursor:default}
#phoneBtn .pi{font-size:34px;line-height:1}
#phoneBtn .pt{font-size:22px;font-weight:900;display:flex;flex-direction:column;line-height:1.05;text-align:left}#phoneBtn .pt small{font-size:12px;color:var(--mute);font-weight:700}
#phoneBtn.buzz{animation:buzz .08s linear 14}
@keyframes buzz{50%{transform:translate(-5px,2px) rotate(-1.2deg)}}
.bdg{display:flex;gap:5px;align-items:center}
.bdg b{font-size:15px;font-weight:900;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.3}
.bdg .k{background:#ff4d5e;color:#fff}.bdg .g{background:#4e66d8;color:#fff}.bdg .f{background:#3a3f55;color:#fff}
.bdg .pu{background:#4a1018;color:#ff8a95;border:1px solid #ff4d5e}.bdg .pd{background:#0f2040;color:#8fb4ff;border:1px solid #4e8cff}
.bdg b.new{animation:bpop .5s ease-out}
@keyframes bpop{0%{transform:scale(1.6)}100%{transform:none}}
/* toast (메인에 남는 유일한 실시간 알림) */
#toast{position:absolute;left:50%;top:94px;transform:translateX(-50%);z-index:62;max-width:1200px;display:none;align-items:center;gap:12px;padding:10px 24px;border-radius:999px;
  background:rgba(14,16,24,.94);border:2px solid #ffd16688;font-size:23px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 12px 34px #000a;cursor:pointer}
#toast.on{display:flex;animation:tin2 .25s ease-out}
#toast.liq{border-color:#ff4d5e;background:rgba(60,8,16,.95)}#toast.kim{border-color:#ffd166;background:rgba(50,38,10,.95);color:#ffe9b0}
#toast.news{border-color:#7aa7ff}#toast.gal{border-color:#8fa0ff;background:rgba(24,30,70,.95)}#toast.good{border-color:#7ee0a8}
#toast small{font-size:16px;color:var(--mute);font-weight:700}
@keyframes tin2{from{opacity:0;transform:translate(-50%,-14px)}}
/* dialog */
#dlg{position:absolute;left:120px;right:120px;bottom:24px;height:206px;background:linear-gradient(180deg,rgba(18,20,29,.95),rgba(12,13,19,.98));
  border:1px solid #3a4058;border-radius:22px;padding:32px 44px 20px;z-index:30;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dlg.off{display:none}
#dlg.idle{cursor:default}
#main.pOn #dlg.idle{display:none}
#dlg .name{position:absolute;left:34px;top:-24px;font-weight:900;font-size:24px;padding:5px 24px;border-radius:14px;background:#2a2f44;border:1px solid #454c69}
#dlg .name.m{background:#5a2b40;border-color:#ff8fb1aa;color:#ffd6e3}
#dlg .name.me{background:#24375e;border-color:#7aa7ffaa;color:#d9e6ff}
#dlg .name.kim{background:#4a3a12;border-color:#ffd166aa;color:#ffe9b0}
#dlg .name.npc{background:#1f3b34;border-color:#7ee0a8aa;color:#d4ffe9}
#dlg .name.hide{display:none}
#dlg .text{font-size:32px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}
#dlg .text.nar{color:#c6cbe0;font-style:italic}
#dlg .next{position:absolute;right:30px;bottom:16px;font-size:20px;color:var(--mute);animation:bob 1s infinite}
#dlg .next.off{visibility:hidden}
@keyframes bob{50%{transform:translateY(5px)}}
#choices{position:absolute;left:820px;top:230px;width:780px;display:flex;flex-direction:column;gap:14px;z-index:64}
#main.kimOn #choices{left:1260px;width:600px}
#main.kimOn:has(#choices button) #npc{left:740px;width:440px;height:690px;top:290px}
#choices button{width:100%;min-height:76px;font-size:26px;padding:14px 28px;border-radius:18px;border:1px solid #4a5170;
  background:linear-gradient(180deg,#262a3e,#1a1d2b);cursor:pointer;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s,border-color .12s;font-weight:700}
#choices button:hover{transform:translateX(8px);border-color:var(--gold)}
#choices button:disabled{opacity:1;color:#5b6178;background:#14161f;border-color:#262a3a;cursor:default;transform:none}#choices button:disabled .k{color:#5b6178}
#choices button .k{display:inline-block;width:36px;color:var(--gold);font-weight:900}
#choices button small{display:block;font-size:19px;color:var(--mute);margin-left:36px;font-weight:400}
/* panel (cards, games) */
#panel{position:absolute;left:600px;top:120px;width:816px;height:640px;z-index:25;display:none;background:rgba(14,16,23,.95);border:1px solid #3a4058;border-radius:26px;padding:26px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#panel.on{display:block}
#panel.wide{left:264px;width:1392px}
#panel h2{margin:0 0 4px;font-size:38px;font-family:var(--hfont);font-weight:400;letter-spacing:-.5px}
#panel .sub{font-size:19px;color:var(--mute);margin-bottom:16px;line-height:1.45}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{position:relative;border:1px solid #3e4563;border-radius:20px;padding:18px 20px 16px;background:linear-gradient(180deg,#20243a,#191c2b);cursor:pointer;text-align:left;min-height:226px;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card:disabled{opacity:.4;cursor:default;transform:none}
.card .k{position:absolute;right:16px;top:12px;font-size:20px;color:var(--gold);font-weight:900}
.card .ic{font-size:50px;line-height:1}
.card b{font-size:29px;margin-top:8px;font-weight:900}
.card .d{font-size:18px;color:#c9cee0;margin-top:6px;line-height:1.45;flex:1}
.card .r{font-size:16px;margin-top:8px;color:var(--mute)}
.card .r i{font-style:normal;padding:2px 10px;border-radius:999px;border:1px solid var(--line);margin-right:6px}
.card .r i.lo{color:var(--green);border-color:#7ee0a866}.card .r i.mid{color:var(--gold);border-color:#ffd16666}.card .r i.hi{color:var(--red);border-color:#ff4d5e88}
.btn{border:1px solid #4a5170;background:linear-gradient(180deg,#2a2f45,#1f2334);border-radius:16px;padding:14px 30px;font-size:24px;cursor:pointer;font-weight:900}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,#ffd166,#f2b443);color:#1a1405;border-color:#ffd166}
.btn.red{background:linear-gradient(180deg,#ff5d6c,#c8303f);color:#fff;border-color:#ff8a95}
.btn.sm{font-size:18px;padding:8px 16px;border-radius:12px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stake{background:#141722;border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:14px}
.stake .amt{font-family:var(--hfont);font-size:40px;color:var(--gold);min-width:250px}
.stake input[type=range]{width:100%;margin:8px 0 4px;accent-color:#ffd166;height:28px}
.stake .loan{margin-left:auto}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-size:22px;padding:12px 8px;border-radius:14px;border:1px solid #4a5170;background:#1b1f2e;cursor:pointer;font-weight:900}
.seg button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.seg button.long.on{background:#ff4d5e;color:#fff;border-color:#ff4d5e}
.seg button.short.on{background:#4e8cff;color:#fff;border-color:#4e8cff}
.gArea{position:relative;height:300px;border-radius:20px;background:#0f1118;border:1px solid #2a3042;overflow:hidden;display:flex;align-items:center;justify-content:center}
.res{font-family:var(--hfont);font-size:46px;text-align:center;min-height:56px;margin-top:12px}
.res.win{color:var(--red)}.res.lose{color:var(--blue)}
.gag{font-size:20px;color:var(--mute);text-align:center;margin-top:2px;min-height:28px}
/* odd-even */
.bowl{width:260px;height:150px;border-radius:0 0 130px 130px;background:linear-gradient(180deg,#7a5232,#4a2f1c);position:relative;box-shadow:inset 0 10px 0 #9a6a42}
.bowl.shake{animation:bowl .18s linear infinite}
@keyframes bowl{25%{transform:rotate(-8deg) translateX(-10px)}75%{transform:rotate(8deg) translateX(10px)}}
.beads{position:absolute;left:0;right:0;bottom:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 90px}
.beads i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d8d8e8 55%,#9aa0b8);box-shadow:0 2px 4px #000a}
/* slot */
.reels{display:flex;gap:16px}
.reel{width:170px;height:200px;border-radius:18px;background:linear-gradient(180deg,#fff,#e6e6ef 50%,#fff);color:#111;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:inset 0 0 24px #0005;border:6px solid #ffd166}
.reel.spin{animation:rspin .09s linear infinite}
@keyframes rspin{50%{transform:translateY(8px);filter:blur(2px)}}
/* chart */
#iCv{width:756px;height:300px;display:block;border-radius:16px;background:#0d0f16}
.pnlBig{font-family:var(--hfont);font-size:64px;line-height:1;text-align:right;white-space:nowrap}
.pnlBig.up{color:var(--red)}.pnlBig.dn{color:var(--blue)}
/* minigames */
.mgBar{position:relative;height:70px;border-radius:16px;background:#2a1d24;overflow:hidden;border:1px solid #444c66}
.mgBar .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#2f6b4c,#3f9467)}
.mgBar .needle{position:absolute;top:-4px;bottom:-4px;width:10px;background:#fff;border-radius:4px;box-shadow:0 0 14px #fff}
.timer{height:12px;border-radius:6px;background:#22263a;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#7ee0a8,#ffd166,#ff4d5e);width:100%}
.order{font-size:30px;font-weight:900;text-align:center;padding:12px;border-radius:16px;background:#221d14;border:1px solid #ffd16655}
.tray{min-height:64px;font-size:40px;text-align:center;margin:10px 0;letter-spacing:4px}
.drinks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.drinks button{font-size:24px;padding:16px 6px;border-radius:16px;border:1px solid #4a5170;background:#1d2131;cursor:pointer;font-weight:900}
.drinks button span{display:block;font-size:44px}
.mash{width:100%;height:190px;border-radius:24px;font-size:40px;font-weight:900;border:2px solid #ffd166;background:linear-gradient(180deg,#5a3b1c,#3a2610);cursor:pointer}
.mash:active{transform:scale(.97)}
.boxes{font-size:30px;text-align:center;letter-spacing:2px;min-height:44px;margin-top:10px;word-break:break-all}
/* shop */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border:1px solid #3e4563;border-radius:16px;padding:10px 12px 10px 64px;background:#1b1f2e;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative;min-height:112px}
.item:hover{border-color:var(--gold)}
.item:disabled{opacity:.4;cursor:default}
.item .ic{font-size:36px;position:absolute;left:14px;top:14px}
.item b{font-size:19px}
.item .p{font-size:20px;color:var(--gold);font-weight:900}
.item .d{font-size:14px;color:var(--mute);line-height:1.3}
.item.own{border-color:#7ee0a8aa;background:#17261e}
.item.own .p{color:var(--green)}
/* screens */
#screen{position:absolute;left:240px;top:90px;width:1440px;height:990px;z-index:24;display:none}
#screen.on{display:block}
.recap{position:absolute;left:70px;right:70px;top:20px;bottom:40px;padding:34px 44px;background:rgba(14,16,23,.95);border:1px solid #3a4058;border-radius:26px;overflow:hidden}
.recap h2{margin:0;font-size:46px;font-family:var(--hfont);font-weight:400}
.recap .sub{color:var(--mute);font-size:21px;margin:4px 0 18px}
.recap .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.recap h3{font-size:20px;color:var(--gold);margin:0 0 8px;letter-spacing:1px}
.recap .li{font-size:23px;line-height:1.6;display:flex;justify-content:space-between;border-bottom:1px dashed #2a3042;padding:3px 0}
.recap .net{font-family:var(--hfont);font-size:52px;margin-top:10px}
.recap .conv{font-size:26px;color:#ffd6e3;margin-top:4px;font-weight:700}
.recap .box{background:#1a1d29;border-radius:16px;padding:14px 18px;font-size:21px;line-height:1.55;margin-bottom:14px}
.recap .ev{background:#221d14;border:1px solid #ffd16655;border-radius:16px;padding:14px 18px;font-size:22px;line-height:1.5;margin-bottom:14px}
.up{color:var(--red)}.dn{color:var(--blue)}
/* fx */
#fx{z-index:60;pointer-events:none;overflow:hidden}
.bigfx{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:var(--hfont);font-size:150px;letter-spacing:-3px;animation:bigin 1.9s ease-out forwards;text-shadow:0 8px 30px #000}
.bigfx.up{color:#ff3b4f;-webkit-text-stroke:3px #fff}
.bigfx.dn{color:#3f7dff;-webkit-text-stroke:3px #fff}
.bigfx small{display:block;font-size:44px;letter-spacing:0;-webkit-text-stroke:0;color:#fff}
@keyframes bigin{0%{transform:scale(2.4);opacity:0}15%{transform:scale(.95);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.aurora{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,59,79,.0),rgba(255,59,79,.35),rgba(255,209,102,.35),rgba(126,224,168,.3),rgba(185,140,255,.35),rgba(255,59,79,0));background-size:300% 100%;animation:aur 1.8s linear forwards}
@keyframes aur{0%{background-position:0 0;opacity:0}20%{opacity:1}100%{background-position:100% 0;opacity:0}}

/* ================= view/base.js — 기본 유틸 · sim 연결 =================
   view 는 클래식 스크립트(같은 전역 스코프). 게임 상태는 sim 이 소유: S = 현재 상태(읽기 전용으로 씀),
   바꾸려면 send(명령) → SIM.apply → 이벤트 재생(events.js). 계산은 q("이름", …) = SIM.query. */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const QS = new URLSearchParams(location.search);
const FAST = QS.get("fast") === "1";
const wait = ms => new Promise(r => setTimeout(r, FAST ? 0 : ms));
const clamp = SIM.clamp;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const { won, sgnWon, man, sgnMan, pct, fmtP, stars } = SIM.F;
const TX = (k, v) => SIM.F.T(k, v);
SIM.configure({ hud: true });

/* 데이터 테이블 (읽기 전용) */
const TK = DATA.TK, TKS = Object.keys(TK), STK = TKS.filter(k => TK[k].type === "stock");
const NPCS = DATA.NPCS, AUG = Object.fromEntries(DATA.AUGS.map(a => [a.id, a])), TIER = DATA.TIER;
const RU = DATA.RULES, MONTH_DAYS = RU.MONTH_DAYS, SLOTS = RU.SLOTS, SLOT_NAME = DATA.SLOT_NAME, SLOT_IC = DATA.SLOT_IC, SLOT_CLOCK = DATA.SLOT_CLOCK;
const GN = DATA.GN, FAME = DATA.FAME, RANKS = DATA.RANKS, KROOM = DATA.KROOM, ITEMS = DATA.ITEMS, JOBS = DATA.JOBS, LOCS = DATA.LOCS, LOC_KEYS = Object.keys(LOCS);
const SAVE_KEY = "longjab_v34";
const REC_KEY = "longjab_records";   /* 엔딩 기록 (본 엔딩·최고 점수) */

/* 연출용 난수 (파티클 위치 등) — 결과에 영향 없음, 상태에 안 들어감 */
let fxSeed = (Date.now() ^ 0x5bd1e995) | 0;
function frnd() { const [a, u] = SIM.m32(fxSeed); fxSeed = a; return u / 4294967296; }
const fpick = arr => arr[Math.floor(frnd() * arr.length)];

/* ---------- sim 연결 ---------- */
let S = null;
const q = (name, ...a) => SIM.query(S, SIM.Q[name], ...a);
const conv = n => SIM.query(S, SIM.F.conv, n);
const has = id => !!(S && S.augs.includes(id));
const absDay = () => (S.month - 1) * MONTH_DAYS + S.day;
const Tnow = () => (absDay() - 1) * SLOTS + S.slot;
const stockOpen = () => RU.STOCK_SLOTS.includes(S.slot);
const isEve = () => S.slot === SLOTS - 1;
const tkOpen = k => !TK[k].lock || has(TK[k].lock);
const mental = () => q("mental");
const MENT = { calm: ["😌", "평온"], anx: ["😰", "불안"], men: ["🌀", "멘헤라"] };
let sending = false;
/* 명령 보내기: 상태 갱신 → 이벤트 재생(대사·연출 끝날 때까지 기다림) */
async function send(cmd) {
  const r = SIM.apply(S, cmd);
  S = r.state;
  await playEvents(r.events);
  return r.events;
}
/* 폰처럼 화면 위에서 바로 바뀌는 명령 (재생은 기다리지 않음) */
function sendQuick(cmd) { const r = SIM.apply(S, cmd); S = r.state; playEvents(r.events); return r.events; }
function newSeed() { const qs = parseInt(QS.get("seed"), 10); return isFinite(qs) ? qs | 0 : ((Date.now() * 2654435761) ^ (performance.now() * 1e6)) | 0; }
function save() { try { if (S && !["opening", "ending"].includes(S.phase)) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function loadSave() { try { const t = localStorage.getItem(SAVE_KEY); if (!t) return null; const o = JSON.parse(t); return o && o.version === SIM.STATE_VERSION && o.pending ? o : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
function clockNow() { return S && S.phase !== "title" ? (S.phase === "payday" ? "23:50" : SLOT_CLOCK[S.slot] || "09:00") : "09:00"; }

/* ===== view/ui.js ===== */
/* ================= view/ui.js — 화면 스케일 · 장면 · 대사창 · 선택지 · 패널 · 사이드 메뉴 · 모달 (v3.2 view 그대로) ================= */
let keyHook = null;   /* 미니게임·카드가 키 입력을 가로챔 */
/* ================= 화면 스케일 (1920×1080 레터박스) ================= */
function fit() {
  const wr = $("#wrap"), vv = window.visualViewport;
  const W = wr.clientWidth || (vv ? vv.width : window.innerWidth), H = wr.clientHeight || (vv ? vv.height : window.innerHeight);
  const s = Math.min(W / 1920, H / 1080);
  $("#stage").style.transform = `translate(${(W - 1920 * s) / 2}px,${(H - 1080 * s) / 2}px) scale(${s})`;
  $("#rotate").classList.toggle("show", W < 820 && H > W && !window.__rotOff);
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
$("#rotOff").onclick = () => { window.__rotOff = 1; $("#rotate").classList.remove("show"); };

/* ================= 장면 ================= */
let curFace = "neutral";
function drawChar() { const el = $("#char"); el.innerHTML = miraeSVG(curFace, S ? S.outfit : "hoodie"); }
function setChar(show, face) { if (face) curFace = face; const el = $("#char"); el.classList.remove("ash"); if (show) { drawChar(); el.classList.remove("hide"); } else el.classList.add("hide"); }
function setFace(f) { if (!f || f === curFace) return; curFace = f; if (!$("#char").classList.contains("hide")) drawChar(); }
function setBg(name, opt) { $("#bg").innerHTML = bgSVG(name, Object.assign({ props: S ? S.props : {} }, opt || {})); }
function setMode(m) { $("#main").dataset.mode = m || ""; }
function setScene(bg, opt = {}) { setBg(bg, opt); setChar(opt.char !== false, opt.face || "neutral"); showKim(false); hideBubble(); setMode(opt.mode || ""); if (!opt.keepSide) hideSide(); hideMap(); }
function showKim(on, face) { const el = $("#npc"); $("#main").classList.toggle("kimOn", !!on); if (on) { el.innerHTML = kimSVG(face); el.classList.remove("hide"); } else el.classList.add("hide"); }
function showNpc(kind, mood) { const el = $("#npc"); if (!kind) { el.classList.add("hide"); return; } el.innerHTML = npcSVG(kind, mood); el.classList.remove("hide"); }
let bubT = null;
function bubble(text, ms = 2600, face) { if (face) setFace(face); const b = $("#bubble"); b.textContent = text; b.classList.remove("on"); void b.offsetWidth; b.classList.add("on"); clearTimeout(bubT); bubT = setTimeout(hideBubble, FAST ? 30 : ms); }
function hideBubble() { $("#bubble").classList.remove("on"); }

/* ================= 대사창 ================= */
let advWait = null, typing = null, chooseWait = null, modalOpen = false;
function nameCls(who) { return "name " + (who === "미래" ? "m" : who === "나" ? "me" : who === "김사장" ? "kim" : who ? "npc" : "hide"); }
function say(who, text, face) {
  if (face) setFace(face);
  hideBubble();
  return new Promise(res => {
    const d = $("#dlg"), nm = d.querySelector(".name"), tx = d.querySelector(".text"), nx = d.querySelector(".next");
    d.classList.remove("off", "idle");
    nm.className = nameCls(who); nm.textContent = who || "";
    tx.className = "text" + (who ? "" : " nar");
    const full = String(text);
    nx.classList.add("off");
    const done = () => {
      if (typing) clearInterval(typing.t); typing = null;
      tx.textContent = full; nx.classList.remove("off");
      advWait = () => { advWait = null; res(); };
    };
    if (FAST || !full.length) { done(); return; }
    let k = 0; tx.textContent = "";
    typing = { t: setInterval(() => { k += 1; tx.textContent = full.slice(0, k); if (k >= full.length) done(); }, 22), finish: done };
  });
}
/* 대기 없는 대사 (집·장소의 상시 대사) */
function idle(who, text, face) {
  if (face) setFace(face);
  const d = $("#dlg"), nm = d.querySelector(".name"), tx = d.querySelector(".text");
  d.classList.remove("off"); d.classList.add("idle");
  nm.className = nameCls(who); nm.textContent = who || "";
  tx.className = "text" + (who ? "" : " nar"); tx.textContent = text;
  d.querySelector(".next").classList.add("off");
}
const M = (t, f) => say("미래", t, f), ME = t => say("나", t), N = t => say(null, t), KIM = t => say("김사장", t);
function hideDlg() { $("#dlg").classList.add("off"); }
function advance() { if ((modalOpen && $("#modal.on")) || chooseWait) return; if (typing) { typing.finish(); return; } if (advWait) advWait(); }
/* 선택지: [{l, sub, k, dis}] → 고른 항목 */
function choose(opts) {
  return new Promise(res => {
    const box = $("#choices"); box.innerHTML = "";
    $("#dlg .next").classList.add("off");
    opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.dataset.bot = o.k || ("c" + i); b.disabled = !!o.dis;
      b.innerHTML = `<span class="k">${i + 1}</span>${esc(o.l)}${o.sub ? `<small>${esc(o.sub)}</small>` : ""}`;
      b.onclick = e => { e.stopPropagation(); if (b.disabled) return; box.innerHTML = ""; chooseWait = null; res(o); };
      box.appendChild(b);
    });
    chooseWait = i => { const b = box.children[i]; if (b && !b.disabled) b.click(); };
  });

function spark(hist, w = 90, h = 30) {
  const c = hist.slice(-12).map(x => x.c); if (c.length < 2) return "";
  const lo = Math.min(...c), hi = Math.max(...c), sp = hi - lo || 1;
  const pts = c.map((v, i) => `${(i / (c.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (v - lo) / sp * (h - 6)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${c[c.length - 1] >= c[0] ? "#ff4d5e" : "#4e8cff"}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

  const C = PNL; if (!C || C.k !== "casino") return;
  const p = C.p, kind = e.kind;
  if (kind === "oddeven") {
    const bowl = p.querySelector("#bowl"); p.querySelector("#beads").innerHTML = ""; bowl.classList.add("shake");
    await wait(2000); bowl.classList.remove("shake");
    p.querySelector("#beads").innerHTML = "<i></i>".repeat(e.show.n);
  }
  if (kind === "card") {
    const cb = p.querySelector("#cB"); cb.classList.add("flip"); await wait(900);
    cb.innerHTML = cardHtml(e.show.B, e.show.Bs); cb.classList.remove("flip");
  }
  if (kind === "slot") {
    const reels = [0, 1, 2].map(i => p.querySelector("#r" + i));
    reels.forEach(x => x.classList.add("spin"));
    const iv = setInterval(() => reels.forEach(x => { if (x.classList.contains("spin")) x.textContent = fpick(SLOT_SYM); }), 70);
    for (let i = 0; i < 3; i++) { await wait(700 + i * 500); reels[i].classList.remove("spin"); reels[i].textContent = e.show.res[i]; }
    clearInterval(iv);
  }
  if (kind === "ladder") { drawLadder(p.querySelector("#lad"), e.show.rungs, e.choice, e.show.prize, true); await wait(3400); }
  floatTxt(sgnWon(e.net), e.net >= 0 ? "#7ee0a8" : "#ff6b7a", 430, 120);
  const R = p.querySelector("#gRes"); R.className = "res " + (e.net > 0 ? "win" : "lose"); R.textContent = `${e.txt}  ${sgnWon(e.net)}`;
  p.querySelector("#gGag").textContent = `= ${conv(e.net)} · 이번 테이블 누적 ${sgnWon(e.total)}`;
  C.played = true;
}
function drawLadder(svg, rungs, choice, prize, animate) {
  const X = [150, 350, 550], top = 34, bot = 212, lv = rungs ? rungs.length : 5, dy = (bot - top) / (lv + 1);
  let h = X.map((x, i) => `<line x1="${x}" y1="${top}" x2="${x}" y2="${bot}" stroke="#8a90a8" stroke-width="6"/><text x="${x}" y="22" font-size="22" font-weight="900" text-anchor="middle" fill="${i === choice ? "#ffd166" : "#c9cee0"}">${"ABC"[i]}</text>`).join("");
  let lane = choice, d = `M${X[lane]} ${top}`;
  if (rungs) {
    rungs.forEach((r, k) => { if (r < 0) return; const y = top + dy * (k + 1); h += `<line x1="${X[r]}" y1="${y}" x2="${X[r + 1]}" y2="${y}" stroke="#8a90a8" stroke-width="6"/>`; });
    rungs.forEach((r, k) => { const y = top + dy * (k + 1); d += ` L${X[lane]} ${y}`; if (r === lane) lane = r + 1; else if (r >= 0 && r + 1 === lane) lane = r; d += ` L${X[lane]} ${y}`; });
    d += ` L${X[lane]} ${bot}`;
    h += `<path id="lp" d="${d}" stroke="#ffd166" stroke-width="10" fill="none" stroke-linejoin="round"/>`;
    h += `<g id="prz" style="opacity:${animate ? 0 : 1};transition:opacity .3s ${FAST ? 0 : 3.1}s">` + X.map((x, i) => `<text x="${x}" y="244" font-size="24" font-weight="900" text-anchor="middle" fill="${i === prize ? "#ff4d5e" : "#6b7186"}">${i === prize ? "x2.8" : "꽝"}</text>`).join("") + `</g>`;
  } else X.forEach(x => { h += `<rect x="${x - 36}" y="${top + 20}" width="72" height="${bot - top - 40}" rx="10" fill="#1a1d29"/><text x="${x}" y="${(top + bot) / 2 + 8}" font-size="26" text-anchor="middle" fill="#6b7186">?</text><text x="${x}" y="244" font-size="24" text-anchor="middle" fill="#6b7186">?</text>`; });
  svg.innerHTML = h;
  const lp = svg.querySelector("#lp");
  if (lp && animate) { const L = lp.getTotalLength(); lp.style.strokeDasharray = L; lp.style.strokeDashoffset = L; void lp.getBoundingClientRect(); lp.style.transition = `stroke-dashoffset ${FAST ? 0 : 3.2}s linear`; lp.style.strokeDashoffset = 0; svg.querySelector("#prz").style.opacity = 1; }
  return lane;
}

/* sim 이벤트 race: 경주 연출 → 결과 → 패널 닫기 */
async function raceRun(e) {
  const C = PNL; if (!C || C.k !== "race") return;
  const p = C.p, H = C.H, win = e.win, choice = e.choice;
  const els = H.map((_, i) => p.querySelector("#hz" + i));
  if (!FAST) {
    const Tf = H.map((_, i) => i === win ? 1 : 1.03 + frnd() * 0.22), ph = H.map(() => frnd() * 6), fq = H.map(() => 3 + frnd() * 5);
    const lead = fpick(H.filter((_, i) => i !== win)).name;
    for (let f = 0; f <= 72; f++) {
      const t = f / 60;
      H.forEach((h, i) => { let x = Math.min(1, t / Tf[i]); if (x < 1) x += 0.035 * Math.sin(t * fq[i] + ph[i]) * (1 - x); els[i].style.left = (clamp(x, 0, 1) * 86) + "%"; });
      if (f === 14) bubble(`${lead} 치고 나간다!!`, 1500, "panic");
      if (f === 40) bubble(`${H[choice].name} 가즈아아아!!`, 1500, "panic");
      await wait(55);
    }
  }
  H.forEach((h, i) => { els[i].style.left = (i === win ? 86 : 50 + frnd() * 30) + "%"; els[i].classList.toggle("win", i === win); });
  /* 결승 연출: 1등 말 흔들림 + 빛남 (가볍게) */
  const wl = els[win].closest(".lane"); if (wl) wl.classList.add("winLane");
  els[win].classList.add("fin1");
  if (choice === win) els[win].classList.add("mine");
  const R = p.querySelector("#gRes"); R.className = "res " + (e.net > 0 ? "win" : "lose"); R.textContent = `1착 ${H[win].name}! ${sgnWon(e.net)}`;
  await wait(1800);
  closePnl();
}

/* ---------- 알바 (미니게임 설명 카드 → 연습판 → 실전) ---------- */
const playMg = (key, su) => key === "cafe" ? mgCafe(su) : key === "store" ? mgStore(su) : key === "mart" ? mgMart(su) : mgWare(su);
async function workPrompt(P) {
  const key = P.key;
  if (!P.setup) {
    if (mgCardOn()) {
      const first = tutOn() && !tSeen("mg-" + key);
      if (await mgCard(key, first) === "practice") return { t: "mgSetup", practice: true };
      tMark("mg-" + key);
      await countdown();
    }
    return { t: "mgSetup" };
  }
  if (P.setup.practice) {
    const ps = await playMg(key, P.setup); hidePanel(); tMark("mg-" + key);
    await mgCard(key, false, ps);
    tMark("mg-" + key);
    await countdown();
    return { t: "mgSetup" };
  }
  const score = await playMg(key, P.setup);
  hidePanel();
  return { t: "mgResult", score };
}

/* ================= view/events.js — sim 이벤트 재생기 =================
   이벤트 하나씩 순서대로: e.h(그 시점 HUD 스냅샷)를 HUD 에 반영하고 연출한다. 대사(say)·모달은 끝날 때까지 기다림.
   casino·race 처럼 애니메이션이 있는 이벤트는 HUD 를 연출 뒤에 반영(돈이 결과 나올 때 바뀌게). */
const LATE_HUD = new Set(["casino", "race", "gacha"]);
const WHO = { m: "미래", me: "나", kim: "김사장", nar: null };
let playing = 0;
async function playEvents(evs) {
  playing++;
  try {
    for (const e of evs) {
      if (e.h && !LATE_HUD.has(e.t)) { HS = e.h; updHud(); }
      await playOne(e);
      if (e.h && LATE_HUD.has(e.t)) { HS = e.h; updHud(); }
    }
  } finally {
    playing--;
    if (!playing) { HS = null; updHud(); if (PH.on) phR(); }
  }
}
async function playOne(e) {
  switch (e.t) {
    case "say": await say(e.who === "npc" ? e.name : WHO[e.who], e.text, e.face); return;
    case "hideDlg": hideDlg(); return;
    case "bubble": bubble(e.text, e.ms, e.face); return;
    case "face": setFace(e.f); return;
    case "scene": setScene(e.bg, { night: e.night, face: e.face, mode: e.mode }); return;
    case "npc": showNpc(e.kind, e.mood); return;
    case "kim": showKim(e.on, e.face); return;
    case "hideUi": hideSide(); closePnl(); return;
    case "tut": if (typeof tutTipNow === "function") await tutTipNow(e.k); return;
    case "fx":
      if (e.k === "ash") await fxAsh();
      else if (e.k === "flex") fxFlex(e.amt);
      else if (e.k === "crack") fxCrack(e.amt);
      else if (e.k === "big") bigFx(e.text, e.kind, e.small);
      return;
    case "hp": fxHp(e.d, e.why); return;
    case "addict": fxAddict(e.d, e.v); return;
    case "addictEv": if (e.k === "secret") { if (e.amt < 0) fxCrack(e.amt); else fxFlex(e.amt); } return;
    case "relic": if (e.how !== "pick") relicGot(e.id, e.how); return;
    case "gacha": await gachaShow(e); return;
    case "impulse": await impulseFx(e); return;
    case "faint": await faintFx(); return;
    case "faintSlot": floatTxt("😵 기절 중… (칸이 그냥 지나감)", "#ff9aa5", 700, 240); await wait(500); return;
    case "continued": return;
    case "ment": fxMent(e.m); return;
    case "cash": fxCash(e.d); return;
    case "debt": fxDebt(e.d); return;
    case "repaid": floatTxt("빚 −" + won(e.a), "#7ee0a8", 60, 120); return;
    case "augfx": augFx(e.id, e.text); return;
    case "toast": toast(e.text, e.kind, e.app, e.room); return;
    case "kakao": case "feed": case "post": if (PH.on && !playing) phR(); else updBadges(); return;
    case "tip": if (e.bubble) bubble(e.bubble, 2200, e.face); if (typeof tutQueue === "function") tutQueue("tip1"); return;
    case "tickFloat": floatTxt(e.text, "#cfd6ea", 860, 150); return;
    case "morning": await morningShow(e); return;
    case "lottoDraw": await lottoDrawShow(e); return;
    case "menhera": await menheraFx(e); return;
    case "casino": await casinoRound(e); return;
    case "race": await raceRun(e); return;
    case "scratch": scratchShow(e); return;
    case "panelEnd":
      if (e.k === "casino" && PNL && PNL.k === "casino" && PNL.played) await wait(1100);
      closePnl(); return;
    case "bought": { setFace("happy"); drawChar(); const c = $("#char"); c.classList.remove("bounce"); void c.offsetWidth; c.classList.add("bounce"); return; }
    case "outfit": drawChar(); return;
    case "opening": await runScene("opening"); return;
    case "ending": await endingShow(); return;
    case "save": save(); return;
    case "error": console.warn("[sim]", e.msg); return;
  }
}

  mp.innerHTML = all.map(([k, L], i) => { const op = L.open.includes(S.slot); return `<button class="loc ${k === "home" ? "home" : ""}" data-pick="${i}" data-bot="m-${k}" ${op ? "" : "disabled"} style="left:${L.pos[0] + 120}px;top:${L.pos[1] - 66}px"><span class="k">${i + 1}</span><span class="ic">${L.ic}</span><b>${L.name}</b><small>${op ? L.hint : "영업 끝 · " + L.open.map(x => SLOT_NAME[x]).join("/") + "만"}</small></button>`; }).join("");
  mp.classList.add("on"); curLoc = "";
  tutHook("map");
  const k = await new Promise(res => { mapRes = res; mp.querySelectorAll(".loc").forEach(b => b.onclick = e => { e.stopPropagation(); if (!b.disabled) res(b.dataset.bot.slice(2)); }); });

}
let mapRes = null, lastGreet = "";
async function locPrompt(P) {
  const key = P.key, L = LOCS[key];
  setScene(L.bg, { face: q("moodFace"), mode: "loc" }); showNpc(L.npc);
  const gk = `${Tnow()}:${key}`;   /* 같은 방문에서 다시 그릴 땐 인사 대신 "또 뭐" (v3.2 와 같음) */
  idle(NPCS[L.npc].name, P.first && gk !== lastGreet ? fpick(GREET[key]) : "또 뭐 하실래요?"); lastGreet = gk;
  const used = S.visit && S.visit.used;
  const opts = q("locOpts", key).concat([{ k: "l-leave", ic: "🚪", l: used ? "볼일 끝 (집으로)" : "나가기 (지도로)", sub: used ? "1칸 사용됨" : "칸 소모 없음", cls: "leave" }]);
  curLoc = key;
  const cp = sideMenu({ title: `${L.ic} ${L.name}`, sub: `${L.hint} · ${S.month}개월차 ${S.day}일 ${SLOT_NAME[S.slot]}`, opts });
  tutHook("loc", key);
  const c = await cp;
  if (c === "__refresh") return null;
  if (c === "l-leave") return { t: "leave" };
  hideSide(); hideDlg();
  return { t: "act", k: c };
}
async function choosePrompt(opts, hook) {
  const cpr = choose(opts.map(o => ({ k: o.k, l: o.l, sub: o.sub, dis: o.dis }))); if (hook) tutHook(hook); return cpr;
}
/* pending → 화면 → 명령 (null 이면 화면만 다시) */
async function prompt(P) {
  switch (P.t) {
    case "home": return homePrompt();
    case "map": return mapPrompt();
    case "loc": return locPrompt(P);
    case "relic": return augPrompt(P);
    case "relicShop": return relicShopPrompt(P);
    case "tempt": { const c = await choosePrompt(P.opts, "tempt"); return { t: "tempt", k: c.k }; }
    case "impulse": { const c = await choosePrompt(P.opts, "impulse"); return { t: "reply", i: P.opts.findIndex(o => o.k === c.k) }; }
    case "loan": return loanPrompt(P);
    case "encounter": { const c = await choosePrompt(P.opts); return { t: "encounter", ask: c.k === "enc-ask" }; }
    case "menhera": { const c = await choosePrompt(P.opts, "menhera"); return { t: "reply", i: P.opts.findIndex(o => o.k === c.k) }; }
    case "payday": { const c = await choosePrompt(P.opts, P.stage === "choose" ? "payday" : null); return { t: "payday", k: c.k }; }
    case "work": return workPrompt(P);
    case "casino": return casinoPrompt(P);
    case "race": return racePrompt(P);
    case "scratch": return scratchPrompt(P);
    case "lotto": return lottoPrompt(P);
    case "repay": return repayPrompt(P);
    case "shop": return shopPrompt(P);
    case "brokerTrade": { await openPhone("stock", "broker"); return { t: "brokerClose" }; }
  }
  console.warn("unknown pending", P.t);
  return null;
}
let endChoice = null;
async function mainLoop(first) {
  if (first) await send(first);
  for (; ;) {
    const P = S.pending;
    if (!P) return;
    if (P.t === "ending") {
      if (!P.cont) return;
      /* 정식 엔딩: 화면에서 '계속하기' 고르면 자유 모드로 이어 감 */
      const v = await new Promise(r => { endChoice = r; });
      endChoice = null;
      if (v !== "cont") return;
      $("#full").classList.remove("on"); $("#full").innerHTML = "";
      await send({ t: "continue" });
      toast("🎉 빚 없는 자유 모드 — 꾸미기·투자·갤 명성 마음대로 (이자일 없음)", "good", null);
      continue;
    }
    updHud();
    const c = await prompt(P);
    if (c) await send(c);
  }
}

/* ================= 엔딩 (스코어보드 · 정식 엔딩 컷신 → 계속하기) ================= */
const pctOf = (w, n) => n ? Math.round(w / n * 100) + "%" : "-";
function sbHtml(sb, E) {
  const cells = [
    ["엔딩", `${E.h}`], ["버틴 날", `${sb.days}일 (${sb.month}개월차 ${sb.day}일)`], ["총 수익 (투자 실현+평가)", sgnWon(sb.profit)], ["최대 자산", won(sb.maxAsset)],
    ["갚은 빚", won(sb.repaid)], ["남은 빚", won(sb.debt)], ["알바 수입", won(sb.earned)], ["도박 순손익", sgnWon(sb.gnet)],
    ["도박 승률", `${pctOf(sb.gW, sb.gN)} (${sb.gW}/${sb.gN})`], ["투자 승률", `${pctOf(sb.iW, sb.iN)} (${sb.iW}/${sb.iN})`], ["청산", `${sb.liq}회`], ["갤 명성", `${sb.fame} · ${sb.rank}`],
    ["낸 이자", won(sb.interest)], ["도박 중독도", `${sb.addict}`], ["기절", `${sb.faint}회`], ["돌발 매수", `${sb.impulse}회`],
  ];
  return `<div class="sboard">${cells.map(([a, b]) => `<div><small>${a}</small><b>${esc(b)}</b></div>`).join("")}</div>`;
}
async function endingShow() {
  const E = S.endInfo; if (!E) return;
  if (PH.on) closePhone(true); if (coachRun) coachRun.skip(); hideDlg(); closePnl(); hideSide(); hideMap(); $("#modal").classList.remove("on"); $("#modal").innerHTML = ""; modalOpen = false; $("#choices").innerHTML = ""; chooseWait = null; keyHook = null; $("#augPick").classList.remove("on");
  HS = null;
  if (E.kind === "clear") { updHud(); await runScene("clear"); }
  clearSave(); updHud();
  const rec = recSave(E.kind, E.sb);
  const f = $("#full"); f.classList.add("on");
  f.innerHTML = `<div class="end end-${E.kind}"><div class="art">${bgSVG(E.bg, { props: S.props, night: E.night })}</div>
    ${E.noChar ? "" : `<div class="echar">${miraeSVG(E.face, S.outfit)}</div>`}
    <div class="card2"><span class="tag ${E.ok ? "ok" : ""}">${E.tag}</span><h1>${esc(E.h)}</h1>
      <div class="lead">${esc(E.lead)}</div>
      <h3 class="sbh">📊 스코어보드</h3>${sbHtml(E.sb, E)}
      <div class="eaug">🎁 ${S.augs.length ? S.augs.map(x => AUG[x].ic + " " + AUG[x].name).join(" · ") : "유품 없음"} · 시드 ${S.seed} · 엔딩 기록 ${["clear", "bad1", "bad2"].map(k => rec.seen[k] ? "✅" : "⬜").join("")}</div>
      <div class="row">${E.cont ? `<button class="btn pri" id="contE" data-bot="cont">계속하기 — 빚 없는 자유 모드 (Enter)</button><button class="btn" id="again" data-bot="again">새 게임</button>` : `<button class="btn pri" id="again" data-bot="again">새 게임 (Enter)</button>`}</div>
      <div class="disc">※ 이 게임은 도박·투자 권유가 아닙니다. 종목·코인·차트는 전부 가상(합성)이고 등장인물·업체·커뮤니티도 가상입니다.<br>현실의 사채·도박·고배율 선물은 진짜로 원양어선입니다.</div></div></div>`;
  $("#again").onclick = e => { e.stopPropagation(); clearSave(); location.href = location.pathname + location.search; };
  if ($("#contE")) $("#contE").onclick = e => { e.stopPropagation(); if (endChoice) endChoice("cont"); };
}

/* ================= 타이틀 ================= */
function showTitle() {
  const f = $("#full"); f.classList.add("on");
  const sv = loadSave();
  f.innerHTML = `<div class="title"><div class="ticker"><span>[속보] 주식갤 고닉 「롱잡고알바감」 빚 3천 고백 ▲ 김사장 캐피탈 금리 동결 (월 5%) ▲ 빚트코인 오늘도 위아래로 흔듦 ▲ 멍멍코인 개가 짖음 ▲ 원양어선 선원 상시 모집 ▲ 형 나 믿지? ▲ 이 게임은 도박·투자 권유가 아닙니다 ▲</span></div>
    <div class="tchar">${miraeSVG("smug")}</div><div class="stamp">빚 3,000만</div>
    <div class="tx"><h1>롱잡고알바감</h1><div class="tg">~빚 3천 갚기 전엔 못 헤어져~</div>
    <div class="tg2">여친이 100일 기념으로 빚을 고백했다. 사채업자가 문을 두드린다.<br>하루 3칸, 한 달 7일. 알바냐, 경마냐, 50배냐. 체력 아끼고, 부모님 유품 챙기고, 빚 0원 만들어라.</div>
    <div class="acts"><button class="btn pri" id="newG" data-bot="newG" style="font-size:30px;padding:18px 44px">새 게임 (Enter)</button>${sv && sv.phase !== "ending" ? `<button class="btn" id="contG" data-bot="contG" style="font-size:26px">이어하기 · ${sv.month}개월차 ${sv.day}일 ${SLOT_NAME[sv.slot] || ""}</button>` : ""}</div></div>
    <div class="note">❓ 처음이면 새 게임 → 첫날 튜토리얼이 따라옴 (메뉴에서 끄기 가능) · 컨셉 프로토타입 v3.3 · 30~60분 (하루 3칸 · 한 달 7일 · 시간 제한 없음 · 엔딩 3종) · 클릭/Space/Enter = 진행 · 숫자키 = 선택 · P = 폰 · D = 디버그<br>이 게임은 도박·투자 권유가 아닙니다. 종목·코인은 전부 가상 · 등장인물·업체도 가상입니다.</div></div>`;
  $("#newG").onclick = e => { e.stopPropagation(); clearSave(); f.classList.remove("on"); f.innerHTML = ""; newGame(); };
  if ($("#contG")) $("#contG").onclick = e => { e.stopPropagation(); f.classList.remove("on"); f.innerHTML = ""; resume(sv); };
}
function newGame() {
  const seed = newSeed();
  S = SIM.createGame(seed, { tut: tutOn(), rngv: QS.get("rng") === "v1" ? 1 : 2 });   /* ?rng=v1 = v3.2 호환 난수 (회귀 비교용) */
  fxSeed = seed ^ 0x2545F491;
  updHud();
  mainLoop({ t: "start" });
}
function resume(sv) {
  S = sv; fxSeed = (S.seed ^ S.rng) | 0;
  updHud();
  SIM.apply(S, { t: "read" });
  mainLoop(null);
}

/* ================= 입력 ================= */
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("button"); if (b) b.blur(); }, true);
$("#main").addEventListener("click", e => { if (e.target.closest("button,#panel,#screen,input,#side,#map,#hud,#toast")) return; advance(); });
document.addEventListener("keydown", e => {
  const qs = s => document.querySelector(s), go = e.key === " " || e.key === "Enter", num = /^[0-9]$/.test(e.key) ? +e.key - 1 : -1;
  if (e.key === "d" || e.key === "D") { dbgOn = !dbgOn; updDebug(); return; }
  if (e.repeat && go) { e.preventDefault(); return; }
  if (go || /^[0-9]$/.test(e.key)) e.preventDefault();
  if (coachRun) {
    if (e.key === "Escape") { coachRun.skip(); e.preventDefault(); return; }
    if (go && !$("#coach").dataset.target) { e.preventDefault(); coachRun.next(); return; }
    if (!$("#coach").dataset.target) { e.preventDefault(); return; }   // 설명 단계: 다른 키 막음 · 행동 단계: 통과
  }
  if ((e.key === "h" || e.key === "H") && !keyHook) { helpNow(); return; }
  if ((e.key === "m" || e.key === "M") && !keyHook && !modalOpen && $("#menuBtn")) { $("#menuBtn").click(); return; }
  if ((e.key === "p" || e.key === "P") && !keyHook) { togglePhone(); return; }
  if (qs("#augPick.on")) { if (num >= 0) { const c = qs(`#augPick [data-pick="${num}"]`); if (c) c.click(); } return; }
  if (qs("#modal.on")) { if (go) { const b = qs("#modal .btn.pri") || qs("#modal .btn"); if (b) b.click(); } return; }
  if (PH.on) { if (e.key === "d" || e.key === "D") return; phoneKey(e); e.preventDefault(); return; }
  if (keyHook && keyHook(e)) return;
  if (qs("#full.on")) { if (go) { const b = qs("#full #contE") || qs("#full #again") || qs("#full #newG"); if (b) b.click(); } return; }
  if (chooseWait && !modalOpen) { if (num >= 0) chooseWait(num); return; }
  if (qs("#screen.on")) { if (go) { const b = qs("#screen .btn.pri"); if (b) b.click(); } return; }
  if (qs("#panel.on")) {
    if (num >= 0) { const c = qs(`#panel [data-pick="${num}"]`); if (c && !c.disabled) c.click(); return; }
    if (go) { const b = [...document.querySelectorAll("#panel .btn.pri")].find(x => !x.disabled); if (b) b.click(); }
    return;
  }
  if (go && (advWait || typing)) { advance(); return; }
  if (qs("#map.on")) { if (num >= 0) { const c = qs(`#map [data-pick="${num}"]`); if (c && !c.disabled) c.click(); } return; }
  if (qs("#side.on")) { if (num >= 0) { const c = qs(`#side [data-pick="${num}"]`); if (c && !c.disabled) c.click(); } return; }
  if (go) advance();
});
$("#helpBtn").onclick = e => { e.stopPropagation(); helpNow(); };
fit();
/* 자동 테스트(Playwright 봇)용 창구 — v3.2 와 같은 이름 */
window.__G = { get S() { return S; }, isEve, q, waiting: () => !!advWait || !!typing, TK, has, holdVal: () => q("holdVal"), interestDue: () => q("interestDue"), loanCap: () => q("loanCap"), Tnow, stockOpen, cpnl: c => q("cpnl", c), PH, phoneOk, unreal, GN, rec, get coach() { return !!coachRun; }, SIM };
showTitle();
