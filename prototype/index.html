<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>롱잡고알바감 프로토타입</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e13;--panel:#161821;--panel2:#1e2130;--panel3:#262a3b;--line:#2e3346;--fg:#eceef4;--mute:#9aa1b6;--dim:#6b7186;
  --acc:#7aa7ff;--pink:#ff8fb1;--green:#7ee0a8;--gold:#ffd166;--red:#ff5d6c;--blue:#4e8cff;
  --trust:#7aa7ff;--thrill:#ff8fb1;--comfort:#7ee0a8;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;max-width:100vw;background:#05060a;overflow:hidden;overscroll-behavior:none;color:var(--fg);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
#wrap{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#05060a}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
#main{position:absolute;left:0;top:0;width:1440px;height:1080px;overflow:hidden;background:#0b0c11}
#bg,#fg,#charLayer,#hotLayer,#callUI,#screen{position:absolute;inset:0}
#bg svg,#fg svg{width:100%;height:100%;display:block}
#fg{pointer-events:none}
#charLayer{pointer-events:none}
#charLayer .char{position:absolute;left:466px;top:120px;width:507px;height:760px;transition:opacity .35s, transform .35s}
#charLayer .char.hide{opacity:0;transform:translateY(20px)}
#hotLayer{pointer-events:none}
.hot{position:absolute;pointer-events:auto;cursor:zoom-in;border-radius:18px;border:2px dashed rgba(255,209,102,.0);
  animation:hotPulse 2.2s ease-in-out infinite}
.hot::after{content:attr(data-label);position:absolute;left:50%;top:-34px;transform:translateX(-50%);white-space:nowrap;
  font-size:18px;background:rgba(10,12,18,.85);border:1px solid #ffd16688;color:var(--gold);padding:2px 10px;border-radius:999px}
.hot:hover{border-color:#ffd166cc;background:rgba(255,209,102,.08)}
.hot.done{animation:none;opacity:.35;cursor:default}
.hot.done::after{content:"확인함"}
@keyframes hotPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.0);border-color:rgba(255,209,102,.25)}50%{box-shadow:0 0 0 10px rgba(255,209,102,.10);border-color:rgba(255,209,102,.8)}}
/* HUD */
#hud{position:absolute;left:0;top:0;right:0;height:96px;display:flex;align-items:center;gap:22px;padding:0 28px;
  background:linear-gradient(180deg,rgba(8,9,13,.92),rgba(8,9,13,.55) 70%,rgba(8,9,13,0));z-index:20;pointer-events:none}
#hud.off{display:none}
#hud .when{font-weight:900;font-size:30px;letter-spacing:-.5px;white-space:nowrap}
#hud .when small{display:block;font-size:17px;font-weight:500;color:var(--mute);letter-spacing:0}
#hud .slots{display:flex;gap:6px;align-items:center}
#hud .slots span{font-size:16px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:rgba(20,22,30,.7)}
#hud .slots span.now{color:#111;background:var(--gold);border-color:var(--gold);font-weight:700}
#hud .slots span.past{color:var(--mute);text-decoration:line-through}
#hud .mirae{margin-left:auto;display:flex;align-items:center;gap:14px;background:rgba(22,24,33,.85);border:1px solid var(--line);
  border-radius:999px;padding:6px 22px 6px 6px;max-width:640px;pointer-events:auto}
#hud .mirae .ava{width:70px;height:70px;border-radius:50%;overflow:hidden;background:#2a2e3e;flex:none}
#hud .mirae .ava svg{width:100%;height:100%}
#hud .mirae .th{font-size:18px;color:var(--mute);line-height:1.35}
#hud .mirae .th b{display:block;font-size:14px;color:var(--pink);font-weight:500;letter-spacing:1px}
#hud .sig{font-size:17px;color:var(--gold);border:1px solid #ffd16655;border-radius:999px;padding:5px 14px;white-space:nowrap;background:rgba(20,22,30,.7)}
#hud .menu{pointer-events:auto;border:1px solid var(--line);background:rgba(20,22,30,.8);border-radius:12px;padding:8px 14px;font-size:17px;cursor:pointer}
/* dialog */
#dlg{position:absolute;left:36px;right:36px;bottom:28px;height:236px;background:linear-gradient(180deg,rgba(18,20,29,.94),rgba(12,13,19,.97));
  border:1px solid #3a4058;border-radius:22px;padding:34px 44px 24px;z-index:30;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dlg.off{display:none}
#dlg .name{position:absolute;left:34px;top:-26px;font-weight:700;font-size:25px;padding:6px 26px;border-radius:14px;background:#2a2f44;border:1px solid #454c69}
#dlg .name.m{background:#5a2b40;border-color:#ff8fb1aa;color:#ffd6e3}
#dlg .name.me{background:#24375e;border-color:#7aa7ffaa;color:#d9e6ff}
#dlg .name.npc{background:#2a4a3a;border-color:#7ee0a8aa;color:#d8f7e6}
#dlg .name.hide{display:none}
#dlg .text{font-size:31px;line-height:1.6;white-space:pre-wrap;word-break:keep-all}
#dlg .text.nar{color:#c6cbe0;font-style:italic}
#dlg .next{position:absolute;right:30px;bottom:18px;font-size:20px;color:var(--mute);animation:bob 1s infinite}
#dlg .next.off{visibility:hidden}
@keyframes bob{50%{transform:translateY(5px)}}
#choices{position:absolute;left:40px;top:190px;width:560px;display:flex;flex-direction:column;gap:14px;z-index:35}
#choices button{width:100%;min-height:74px;font-size:25px;padding:14px 30px;border-radius:18px;border:1px solid #4a5170;
  background:linear-gradient(180deg,#232739,#1a1d2b);cursor:pointer;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .12s,border-color .12s}
#choices button:hover{transform:translateX(8px);border-color:var(--gold)}
#choices button .k{display:inline-block;width:34px;color:var(--gold);font-weight:700}
#choices button small{display:block;font-size:18px;color:var(--mute);margin-left:34px}
/* screens */
#screen{z-index:25;display:none}
#screen.on{display:block}
.panel{background:rgba(18,20,29,.92);border:1px solid var(--line);border-radius:24px}
.btn{border:1px solid #4a5170;background:linear-gradient(180deg,#2a2f45,#1f2334);border-radius:16px;padding:16px 34px;font-size:24px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,#ffd166,#f2b443);color:#1a1405;border-color:#ffd166}
.btn:disabled{opacity:.4;cursor:default}
/* recap */
.recap{position:absolute;left:90px;right:90px;top:120px;bottom:60px;padding:40px 52px;overflow:auto}
.recap h2{margin:0 0 6px;font-size:44px;letter-spacing:-1px}
.recap .sub{color:var(--mute);font-size:21px;margin-bottom:24px}
.recap section{opacity:0;transform:translateY(10px);transition:.45s;margin:0 0 22px}
.recap section.in{opacity:1;transform:none}
.recap h3{font-size:21px;color:var(--gold);margin:0 0 10px;letter-spacing:1px;font-weight:700}
.recap .row{font-size:23px;line-height:1.65;color:#d7dbea}
.recap .ev{display:inline-block;margin:4px 8px 4px 0;padding:4px 14px;border-radius:999px;background:#232738;border:1px solid var(--line);font-size:20px}
.recap .ev.bad{border-color:#ff5d6c88;color:#ffb3bb}
.recap .ev.good{border-color:#7ee0a888;color:#c7f5da}
.kk{display:flex;gap:16px;align-items:baseline;padding:10px 16px;border-radius:14px;background:#1b1e2b;margin:6px 0;cursor:pointer;border:1px solid transparent;font-size:23px}
.kk:hover{border-color:#ffd16677}
.kk .tm{font-family:ui-monospace,Menlo,monospace;color:var(--gold);font-size:21px;min-width:74px}
.kk .tm.late{color:#ff9aa6;font-weight:700}
.kk.del .tx{color:var(--dim);font-style:italic}
.recap .trace{font-size:22px;color:#c3c8db;padding-left:18px;border-left:3px solid #ff8fb155;margin:6px 0}
.recap .result{font-size:23px;padding:14px 18px;border-radius:14px;background:#1f2a24;border:1px solid #7ee0a855}
.recap .result.bad{background:#2c1f24;border-color:#ff5d6c55}
/* map */
.mapwrap{position:absolute;left:40px;right:40px;top:112px;bottom:40px;display:flex;gap:28px}
.mapwrap .mapbox{flex:1.35;position:relative;overflow:hidden;padding:0}
.mapwrap .mapbox svg{width:100%;height:100%;display:block}
.mapwrap .list{flex:1;display:flex;flex-direction:column;gap:16px;padding:28px}
.mapwrap h2{margin:0;font-size:36px}
.mapwrap .hint{color:var(--mute);font-size:19px;line-height:1.5}
.place{display:block;width:100%;text-align:left;border:1px solid #3c4260;border-radius:18px;padding:18px 22px;background:#1d2131;cursor:pointer}
.place:hover{border-color:var(--gold);background:#23283b}
.place b{font-size:27px}
.place .d{display:block;font-size:19px;color:var(--mute);margin-top:4px;line-height:1.45}
.tag{display:inline-block;font-size:15px;padding:2px 10px;border-radius:999px;margin:6px 6px 0 0;border:1px solid var(--line);color:var(--mute)}
.tag.t{color:var(--trust);border-color:#7aa7ff66}.tag.h{color:var(--thrill);border-color:#ff8fb166}.tag.c{color:var(--comfort);border-color:#7ee0a866}
.tag.p{color:#111;background:var(--gold);border-color:var(--gold)}
.tag.w{color:#ffb3bb;border-color:#ff5d6c66}
.pin{cursor:pointer}
.pin:hover circle.ring{stroke:#ffd166}
/* call UI */
#callUI{display:none;z-index:15}
#callUI.on{display:block}
#chartBox{position:absolute;left:36px;right:36px;top:108px;height:668px;background:#0f1118;border:1px solid #2a3042;border-radius:22px;overflow:hidden}
#chartHead{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid #222838;font-size:20px;background:#131622}
#chartHead .sym{font-weight:900;font-size:24px}
#chartHead .badge{font-size:16px;padding:2px 10px;border-radius:8px;border:1px solid #444c66;color:#8d94ab}
#chartHead .lev{position:relative;cursor:zoom-in;color:#6d7488;border-color:#ffd16655}
#chartHead .lev.found{color:var(--gold)}
#chartHead .px{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:24px}
#chartHead .pnl{font-size:17px;color:var(--mute);border:1px dashed #444c66;border-radius:10px;padding:4px 12px}
#chartCanvas{position:absolute;left:0;top:64px;width:1368px;height:604px}
#callCard{position:absolute;right:22px;top:80px;width:290px;background:rgba(22,24,34,.92);border:1px solid #3a4058;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
#callCard .ava{width:74px;height:74px;border-radius:50%;overflow:hidden;background:#2a2e3e;flex:none}
#callCard .ava svg{width:100%;height:100%}
#callCard .t{font-size:17px;color:var(--mute)}
#callCard .t b{display:block;color:var(--fg);font-size:21px}
#speed{position:absolute;left:58px;top:690px;display:flex;gap:8px;z-index:3}
#speed button{font-size:16px;padding:6px 14px;border-radius:10px;border:1px solid #3b4260;background:#1a1e2c;cursor:pointer}
#speed button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
#iv{position:absolute;left:36px;right:36px;top:108px;height:668px;display:none;z-index:40;background:rgba(9,10,15,.985);border-radius:22px;border:1px solid #ffd16666;padding:30px 40px}
#iv.on{display:block}
#iv h3{margin:0;font-size:34px;color:var(--gold)}
#iv .f{font-size:19px;color:var(--mute);margin:8px 0 18px;font-family:ui-monospace,Menlo,monospace}
#iv .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
#iv .mode{border:1px solid #3e4563;border-radius:18px;background:#1b1f2e;padding:16px;cursor:pointer;text-align:left;min-height:230px;display:flex;flex-direction:column}
#iv .mode:hover{border-color:var(--gold);transform:translateY(-3px)}
#iv .mode b{font-size:26px}
#iv .mode .ex{font-size:17px;color:#c9cee0;margin:10px 0;line-height:1.45;flex:1}
#iv .mode .p{font-size:40px;font-weight:900;color:var(--gold)}
#iv .mode .p small{font-size:15px;color:var(--mute);font-weight:400;display:block}
#iv .mode.cmd .p{color:var(--red)}
#iv .roll{margin-top:22px;display:none}
#iv .roll.on{display:block}
#iv .bar{position:relative;height:46px;border-radius:12px;background:#2a1d24;overflow:hidden;border:1px solid #444c66}
#iv .bar .ok{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f6b4c,#3f9467)}
#iv .bar .needle{position:absolute;top:-4px;bottom:-4px;width:6px;background:#fff;border-radius:3px;left:0;box-shadow:0 0 12px #fff}
#iv .verdict{font-size:40px;font-weight:900;margin-top:16px}
/* phone */
#phoneCol{position:absolute;left:1440px;top:0;width:480px;height:1080px;background:radial-gradient(circle at 50% 30%,#1a1d2a,#0c0d12);border-left:1px solid #1f2230}
#phone{position:absolute;left:30px;top:40px;width:420px;height:1000px;border-radius:52px;background:#050608;border:2px solid #2d3245;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 8px #0b0c10;padding:14px}
#phoneIn{position:absolute;inset:14px;border-radius:40px;background:#11131b;overflow:hidden;display:flex;flex-direction:column}
#pStatus{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:17px;font-weight:700;color:#d8dbe8;flex:none}
#pStatus .isl{width:110px;height:30px;border-radius:999px;background:#000}
#pBody{flex:1;overflow:hidden;position:relative}
#pTabs{height:86px;flex:none;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222637;background:#0d0f16}
#pTabs button{position:relative;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--mute);padding:6px 16px;border-radius:14px}
#pTabs button.on{color:var(--fg);background:#1f2333}
#pTabs .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
#pTabs .bd{position:absolute;right:8px;top:0;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;display:none;align-items:center;justify-content:center;padding:0 6px;font-weight:700}
#pTabs .bd.on{display:flex}
.app{position:absolute;inset:0;display:none;flex-direction:column}
.app.on{display:flex}
.app .hd{padding:10px 22px 12px;font-size:22px;font-weight:900;border-bottom:1px solid #20243400;display:flex;align-items:center;gap:10px}
.app .hd small{font-size:14px;color:var(--mute);font-weight:500}
.app .sc{flex:1;overflow-y:auto;padding:6px 16px 16px}
.app .sc::-webkit-scrollbar{width:6px}.app .sc::-webkit-scrollbar-thumb{background:#2c3146;border-radius:3px}
.kday{text-align:center;font-size:13px;color:var(--dim);margin:14px 0 6px}
.bub{max-width:78%;margin:6px 0;display:flex;gap:6px;align-items:flex-end}
.bub .b{padding:10px 14px;border-radius:18px;font-size:17px;line-height:1.45;word-break:keep-all}
.bub .t{font-size:12px;color:var(--dim);white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
.bub.m .b{background:#262a3a;border-top-left-radius:6px}
.bub.me{margin-left:auto;flex-direction:row-reverse}
.bub.me .b{background:#ffd166;color:#1d1605;border-top-right-radius:6px}
.bub.del .b{color:var(--dim);font-style:italic;background:#1a1d29}
.bub.sigable{cursor:zoom-in}
.bub.sigable .t{color:#ff9aa6;font-weight:700;text-decoration:underline dotted}
.typing{font-size:15px;color:var(--dim);margin:6px 4px}
.kin{flex:none;border-top:1px solid #222637;padding:10px 12px 12px;background:#0f1118}
.kin .cnt{font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between}
.kin .opts{display:flex;flex-wrap:wrap;gap:6px}
.kin button{font-size:15px;border:1px solid #3a4058;background:#1b1f2d;border-radius:999px;padding:7px 12px;cursor:pointer}
.kin button:hover{border-color:var(--gold)}
.kin button:disabled{opacity:.35;cursor:default}
.pin3{background:linear-gradient(180deg,#3a2a12,#2a1f0f);border:1px solid #ffd16677;border-radius:16px;padding:14px 16px;margin:8px 0 14px;font-size:15.5px;line-height:1.55}
.pin3 b{color:var(--gold);font-size:14px;letter-spacing:1px;display:block;margin-bottom:4px}
.pin3 ol{margin:4px 0 0;padding-left:20px}
.memo h4{margin:16px 0 8px;font-size:15px;color:var(--mute);letter-spacing:1px}
.gap{display:grid;grid-template-columns:1fr 1fr;border:1px solid #2c3146;border-radius:12px;overflow:hidden;margin:6px 0;font-size:14.5px}
.gap div{padding:8px 10px;line-height:1.45}
.gap .s{background:#1a1d29}
.gap .v{background:#26202a;color:#ffd3da}
.gap .hd2{background:#141722;color:var(--dim);font-size:12px;padding:4px 10px}
.gap.pr .v{background:#2a2420;color:#ffe0b3}
.prm{font-size:14.5px;padding:8px 12px;border-radius:10px;background:#1a1d29;margin:5px 0;display:flex;justify-content:space-between;gap:8px}
.prm .st{color:var(--mute);white-space:nowrap}
.prm .st.ok{color:var(--green)}.prm .st.no{color:var(--red)}
.empty{color:var(--dim);font-size:14px;padding:8px 2px}
#pChart{width:388px;height:300px;display:block;border-radius:14px;background:#0d0f16}
.cev{font-size:14.5px;padding:6px 10px;border-bottom:1px solid #1f2333;display:flex;gap:10px}
.cev .tm{font-family:ui-monospace,Menlo,monospace;color:var(--gold)}
/* modal & toast */
#modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(4,5,8,.66)}
#modal.on{display:flex}
#modal .box{min-width:760px;max-width:1240px;background:#171a25;border:1px solid #454c69;border-radius:26px;padding:40px 48px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
#modal h2{margin:0 0 14px;font-size:36px}
#modal .body{font-size:24px;line-height:1.65;color:#d6daea}
#modal .acts{display:flex;gap:16px;margin-top:28px;justify-content:flex-end;flex-wrap:wrap}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:10px}
.card{border:1px solid #3e4563;border-radius:20px;padding:24px;background:#1d2131;cursor:pointer;text-align:left}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card b{font-size:30px;display:block}
.card q{display:block;font-size:21px;color:#d5d9ea;margin:12px 0;quotes:"“" "”"}
.card .eff{font-size:18px;color:var(--mute);line-height:1.6}
.clause{font-size:25px;line-height:1.6;padding:14px 18px;border-radius:14px;background:#221d14;border:1px solid #ffd16644;margin:10px 0}
.clause b{color:var(--gold);margin-right:10px}
.obsview{display:flex;gap:28px;align-items:center}
.obsview .shot{flex:none;width:300px;height:200px;border-radius:18px;background:#0b0c11;border:1px solid #3a4058;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:20px;text-align:center;padding:14px}
.obsview .shot .big{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:900;color:#ff6b7a}
.gapbig{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:16px;overflow:hidden;border:1px solid #3a4058;margin-top:18px;font-size:22px}
.gapbig div{padding:14px 18px}
.gapbig .h{font-size:15px;color:var(--mute);padding-bottom:0;background:#1c1f2c}
.gapbig .s{background:#1c1f2c}
.gapbig .v{background:#2b2128;color:#ffd3da}
#toasts{position:absolute;left:1484px;width:392px;top:150px;z-index:75;display:flex;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}
#modal.on~#toasts{display:none}
.toast{background:rgba(24,26,38,.97);border:1px solid #ffd16699;color:var(--fg);border-radius:16px;padding:12px 16px;font-size:17px;line-height:1.45;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .3s ease-out}
.toast b{color:var(--gold)}
.toast.rel{border-color:#7aa7ff66;font-size:15px;padding:8px 14px}
.toast.bad{border-color:#ff5d6c99}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.float{position:absolute;z-index:60;font-size:24px;font-weight:900;pointer-events:none;animation:fup 1.6s ease-out forwards;text-shadow:0 2px 10px #000}
@keyframes fup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
/* full overlays */
#full{position:absolute;inset:0;z-index:70;display:none}
#full.on{display:block}
.title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(1200px 700px at 70% 30%,#2a2147 0%,#11121b 55%,#07080c 100%)}
.title h1{font-size:132px;margin:0;font-weight:900;letter-spacing:-6px;background:linear-gradient(90deg,#ffd166,#ff8fb1 55%,#7aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .tg{font-size:30px;color:#c5c9db;margin:8px 0 46px}
.title .acts{display:flex;gap:20px}
.title .note{position:absolute;bottom:40px;font-size:19px;color:var(--dim);text-align:center;line-height:1.7}
.title .tchar{position:absolute;right:140px;bottom:0;width:440px;height:660px;opacity:.9}
.end{position:absolute;inset:0;overflow:auto;background:radial-gradient(1200px 800px at 30% 0%,#2a2147 0%,#11121b 60%,#07080c 100%);padding:40px 110px}
.end h1{font-size:64px;margin:0;letter-spacing:-2px}
.end .lead{font-size:24px;color:var(--mute);margin:8px 0 30px}
.end .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.end .cell{background:rgba(22,24,34,.9);border:1px solid var(--line);border-radius:22px;padding:24px 28px}
.end .cell h3{margin:0 0 14px;font-size:20px;color:var(--gold);letter-spacing:1px}
.axis{display:flex;align-items:center;gap:14px;font-size:26px;margin:10px 0}
.axis .ar{font-size:40px;font-weight:900;width:46px;text-align:center}
.axis .ar.up{color:var(--green)}.axis .ar.dn{color:var(--red)}.axis .ar.eq{color:var(--mute)}
.end li{font-size:19px;line-height:1.55;margin:4px 0;color:#d4d8e8}
.end ul{padding-left:22px;margin:0}
.end .bon{margin-top:28px;font-size:26px;line-height:1.6;padding:24px 30px;border-radius:22px;background:linear-gradient(90deg,#2b2236,#1b2235);border:1px solid #4a3e66}
.end .disc{margin-top:22px;font-size:18px;color:var(--dim)}
.teaser{margin-top:14px;border:1px dashed #ffd16699;border-radius:16px;padding:16px 18px;background:#1e1a10}
.teaser .sb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#0e0f14;border:1px solid #444c66;border-radius:12px;padding:10px 14px;font-size:20px}
.chip{display:inline-block;white-space:nowrap;padding:3px 12px;border-radius:999px;background:#2b2f42;border:1px solid #4a5170;font-size:17px;margin:4px 4px 0 0}

#debug{position:absolute;left:12px;bottom:280px;z-index:95;background:rgba(0,0,0,.85);border:1px solid #7aa7ff;border-radius:12px;padding:12px 16px;font:15px/1.5 ui-monospace,Menlo,monospace;color:#bfe0ff;display:none;min-width:360px;pointer-events:auto;white-space:pre}
#debug button{font:14px "Noto Sans KR",sans-serif;margin-top:8px;margin-right:6px;padding:4px 10px;border-radius:8px;border:1px solid #7aa7ff;background:#14203a;color:#cfe2ff;cursor:pointer}
#debug.on{display:block}
/* dawn */
.dawn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#05060c,#141a35 60%,#3a2c4a)}
.dawn .clk{font-family:ui-monospace,Menlo,monospace;font-size:150px;font-weight:900;letter-spacing:-4px}
.dawn .cap{font-size:30px;color:#c4c8dc;margin-top:10px}
.dawn .prog{width:620px;height:8px;border-radius:4px;background:#22263a;margin-top:34px;overflow:hidden}
.dawn .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7aa7ff,#ff8fb1);transition:width .2s linear}
.dawn .ghost{font-size:22px;color:#7d8299;margin-top:24px;min-height:34px}
/* rotate hint */
#rotate{position:fixed;left:12px;right:12px;bottom:12px;z-index:999;display:none;background:rgba(20,22,32,.95);border:1px solid #ffd16688;border-radius:14px;padding:12px 14px;font-size:14px;color:#e8eaf2;line-height:1.5}
#rotate button{float:right;margin-left:10px;border:1px solid #555;border-radius:8px;background:#222;padding:4px 10px;font-size:13px}
#rotate.show{display:block}
.shake{animation:shk .5s linear 2}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,0)}}

.notif .tt{font-size:25px;font-weight:900;margin-top:4px;color:#d62839}
.notif .bd{font-size:19px;color:#333;margin-top:2px}
.notif .mini{height:70px;margin-top:10px;border-radius:10px;background:#fff1f2;overflow:hidden}

const M = (text, face) => ({ t: "say", who: "미래", text, face });

const O = (l, e, then, extra) => Object.assign({ l, e, then: then || [] }, extra || {});
const TH = text => ({ t: "think", text });
const SIG = id => ({ t: "sig", id });
const HOT = o => Object.assign({ t: "hot" }, o);
const FN = fn => ({ t: "fn", fn });
const FACE = f => ({ t: "face", face: f });
const IF = (cond, steps, els) => ({ t: "fn", fn: () => (cond() ? steps : (els || [])) });
async function play(steps) {
  for (const st of steps) {
    if (!st) continue;
    switch (st.t) {
      case "say": await say(st.who, typeof st.text === "function" ? st.text() : st.text, st.face); break;
      case "choice": {
        const opts = st.opts.filter(o => !o.if || o.if());
        const o = await choose(opts);
        S.choiceCount = (S.choiceCount || 0) + 1;
        if (o.e) rel(o.e);
        if (o.fn) { const r = await o.fn(); if (Array.isArray(r)) await play(r); }
        if (o.then && o.then.length) await play(o.then);
        break;
      }
      case "think": S.thought = st.text; updHud(); break;
      case "sig": await foundSignal(st.id); break;
      case "hot": addHot(st); break;
      case "face": setFace(st.face); break;
      case "fn": { const r = await st.fn(); if (Array.isArray(r)) await play(r); break; }
    }
  }
}

/* ================= 차트 그리기 (canvas) ================= */
function drawChart(cv, n, upto, opt = {}) {
  const ctx = cv.getContext("2d"), Wd = cv.width, Ht = cv.height;
  const bars = barsOf(n), m = MK(n), up = clamp(upto, 0, bars.length - 1);
  const padL = opt.small ? 8 : 20, padR = opt.small ? 52 : 110, padT = opt.small ? 10 : 24, padB = opt.small ? 24 : 40;
  ctx.clearRect(0, 0, Wd, Ht); ctx.fillStyle = "#0d0f16"; ctx.fillRect(0, 0, Wd, Ht);
  const G = 5, nC = Math.ceil(bars.length / G), cw = (Wd - padL - padR) / nC;
  const cs = [];
  for (let k = 0; k * G <= up; k++) {
    const seg = bars.slice(k * G, Math.min(up + 1, k * G + G));
    cs.push({ o: seg[0].o, c: seg[seg.length - 1].c, h: Math.max(...seg.map(b => b.h)), l: Math.min(...seg.map(b => b.l)) });
  }
  let lo = Math.min(...cs.map(c => c.l)), hi = Math.max(...cs.map(c => c.h));
  const lines = [];
  const lastLog = n.log.filter(e => e.i <= up);
  const curStop = (() => { let st = null, av = null, pos = 0, old = null; for (const e of lastLog) { if (e.type === "entry") { st = e.px - m.stop; av = e.px; pos = e.pos; } if (e.type === "add") { av = (av * pos + e.px) / (pos + 1); pos++; } if (e.type === "del") { old = st; st = null; } if (["stop", "tp", "liq", "close"].includes(e.type)) pos = 0; } return { st, av, pos, old }; })();
  if (curStop.pos) { if (curStop.av) lines.push({ y: curStop.av, c: "#ffd166", l: "평단", dash: [10, 6] }); }
  if (curStop.pos && curStop.st != null) lines.push({ y: curStop.st, c: "#b9a6ff", l: "손절선" });
  if (curStop.old != null && curStop.pos) lines.push({ y: curStop.old, c: "#ff5d6c", l: "손절선(삭제됨)", dash: [4, 6], a: .55 });
  lines.forEach(L => { lo = Math.min(lo, L.y); hi = Math.max(hi, L.y); });
  const span = Math.max(hi - lo, m.stop * 1.6); const mid = (hi + lo) / 2; lo = mid - span * 0.58; hi = mid + span * 0.58;
  const Y = v => padT + (hi - v) / (hi - lo) * (Ht - padT - padB);
  const X = i => padL + (i / G) * cw;
  // grid & time
  ctx.strokeStyle = "#1c2030"; ctx.lineWidth = 1; ctx.fillStyle = "#6b7186"; ctx.font = (opt.small ? 11 : 16) + "px ui-monospace,Menlo,monospace";
  for (let k = 0; k <= 4; k++) { const y = padT + k * (Ht - padT - padB) / 4; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(Wd - padR, y); ctx.stroke(); ctx.fillText((hi - k * (hi - lo) / 4).toFixed(n.mk === "BTC" ? 0 : 1), Wd - padR + 6, y + 5); }
  for (let i = 0; i < bars.length; i += 90) { ctx.fillText(kst(i), X(i), Ht - (opt.small ? 6 : 12)); }
  // 02:00 통화 종료선
  if (!opt.small) { const x = X(CALL_END_I); ctx.strokeStyle = "#3a3f58"; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, Ht - padB); ctx.stroke(); ctx.setLineDash([]); ctx.fillText("02:00 통화 끝 · 이후는 새벽 구간", x + 8, padT + 16); }
  // candles (상승 빨강, 하락 파랑)
  cs.forEach((c, k) => {
    const x = padL + k * cw + cw / 2, upC = c.c >= c.o, col = upC ? "#ff5d6c" : "#4e8cff";
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = opt.small ? 1 : 1.5;
    ctx.beginPath(); ctx.moveTo(x, Y(c.h)); ctx.lineTo(x, Y(c.l)); ctx.stroke();
    const y1 = Y(Math.max(c.o, c.c)), y2 = Y(Math.min(c.o, c.c));
    ctx.fillRect(x - cw * 0.36, y1, cw * 0.72, Math.max(1.5, y2 - y1));
  });
  // lines
  lines.forEach(L => {
    ctx.globalAlpha = L.a || 1; ctx.strokeStyle = L.c; ctx.lineWidth = opt.small ? 1.5 : 2.5; ctx.setLineDash(L.dash || []);
    ctx.beginPath(); ctx.moveTo(padL, Y(L.y)); ctx.lineTo(Wd - padR, Y(L.y)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = L.c; ctx.font = (opt.small ? 11 : 17) + "px 'Noto Sans KR',sans-serif"; ctx.fillText(L.l, padL + 6, Y(L.y) - 6); ctx.globalAlpha = 1;
  });
  // markers
  const MC = { entry: "#ffd166", add: "#ff9f43", del: "#ff5d6c", stop: "#b9a6ff", tp: "#7ee0a8", liq: "#ff3b4f", close: "#cfd3da", deposit: "#7ee0a8" };
  lastLog.forEach(e => {
    if (!MC[e.type]) return;
    const x = X(e.i) + cw / 2, y = Y(e.px);
    ctx.fillStyle = MC[e.type]; ctx.beginPath(); ctx.arc(x, y, opt.small ? 3.5 : 7, 0, Math.PI * 2); ctx.fill();
    if (!opt.small) { ctx.font = "15px 'Noto Sans KR',sans-serif"; ctx.fillText(EVK[e.type](e, n).replace(/ \(.*\)/, ""), x + 10, y - 10); }
  });
  // 현재가
  const lastC = bars[up].c; ctx.fillStyle = "#e8eaf2"; ctx.fillRect(Wd - padR + 2, Y(lastC) - (opt.small ? 8 : 13), padR - 4, opt.small ? 16 : 26);
  ctx.fillStyle = "#111"; ctx.font = "bold " + (opt.small ? 11 : 16) + "px ui-monospace,Menlo,monospace"; ctx.fillText(lastC.toFixed(n.mk === "BTC" ? 0 : 2), Wd - padR + 6, Y(lastC) + (opt.small ? 4 : 6));
}

  if (e.key === "d" || e.key === "D") { dbgOn = !dbgOn; updDebug(); return; }
  if (go || num >= 0) e.preventDefault();
  if (q("#modal.on")) {                                         // 모달: Enter/Space = 기본 버튼, 숫자 = 카드
    if (num >= 0) { const c = document.querySelectorAll("#modal [data-pick]")[num]; if (c) c.click(); }
    else if (go) { const b = q("#modal .btn.pri") || q("#modal .btn"); if (b) b.click(); }
    return;
  }
  if (q("#iv.on")) { if (num >= 0) { const m = document.querySelectorAll("#iv .mode:not([disabled])")[num]; if (m) m.click(); } return; }
  if (q("#goDay") && q("#screen.on")) { if (go) q("#goDay").click(); return; }
  const places = [...document.querySelectorAll("#screen .place[data-place]")].filter(x => x.dataset.place);
  if (places.length) { if (num >= 0 && places[num]) places[num].click(); return; }
  if (q("#full.on #newG")) { if (go) q("#full.on #newG").click(); return; }
  if (go) advance();
  else if (num >= 0 && chooseWait && !modalOpen) chooseWait(num);
});
fit();
window.__G = { get S() { return S; }, SESS, parseCsv, MARKET };
showTitle();
