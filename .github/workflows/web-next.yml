# v4 리디자인 미리보기: v4-redesign 브랜치에 푸시될 때마다 WebGL 빌드 → 별도 저장소 Pages
#   https://yeo-develop.github.io/kw-game-next/
# 빌드 과정은 web.yml 과 같고, 마지막에 yeo-develop/kw-game-next 의 gh-pages 로 밀어 넣는다
# (쓰기 배포 키 = 시크릿 NEXT_DEPLOY_KEY). main 사이트는 건드리지 않음.
name: web-next

on:
  push:
    branches: [v4-redesign]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web          # web.yml 과 같은 그룹 — Unity Personal 좌석 하나를 동시에 두 빌드가 쓰지 않게
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 멈춘 Unity 가 Personal 좌석을 6시간 붙잡지 않게
    steps:
      - uses: actions/checkout@v4

      - name: 유료 에셋 받기 (비공개 저장소)
        uses: actions/checkout@v4
        with:
          repository: yeo-develop/kw-game-assets
          ssh-key: ${{ secrets.ASSETS_SSH_KEY }}
          path: .paid
      - run: cp -R .paid/Assets/. Assets/ && cp -R .paid/Packages/. Packages/ && rm -rf .paid

      # Library 에 유료 에셋 임포트 결과가 들어감 → 외부 기여자 PR 워크플로는 저장소 설정에서 승인 필수로 막아 둠
      # 스크립트가 바뀐 커밋에 옛 Library 를 복원하면 Unity 가 시작 직후 Killed(137) 로 죽음 (2026-10-13, 10번 중 8번).
      # 그래서 스크립트까지 똑같을 때만 재사용 (restore-keys 없음). 코드 바뀐 빌드는 새로 임포트 ~17분.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL3-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt', 'Assets/**/*.cs', 'Assets/**/*.asmdef') }}

      # 러너에서 Unity 가 시작 직후(어셈블리 로드 중) Killed(137) 로 죽는 일이 잦음 — 같은 러너·캐시·커밋에서도 될 때 있고 안 될 때 있음.
      # 죽는 건 활성화 직후 몇 초라 싸게 다시 시도 (최대 4번)
      - id: build1
        continue-on-error: true
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          allowDirtyBuild: true
      - id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          allowDirtyBuild: true
      - id: build3
        if: steps.build2.outcome == 'failure'
        continue-on-error: true
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          allowDirtyBuild: true
      - id: build4
        if: steps.build3.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          allowDirtyBuild: true
      - name: 버전 표시
        run: |
          sudo chown -R "$USER" build
          git log -1 --format='%H%n%cd %s' --date=format:'%F %R' > build/WebGL/WebGL/version.txt
          touch build/WebGL/WebGL/.nojekyll

      - name: 미리보기 사이트로 배포 (kw-game-next gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.NEXT_DEPLOY_KEY }}
          external_repository: yeo-develop/kw-game-next
          publish_branch: gh-pages
          publish_dir: build/WebGL/WebGL
          force_orphan: true
