<!-- Question: 상태창이 시키는 대로 알바 → 방 → 투자 → 집으로 올라가는 한 판이, 뭘 해야 할지 늘 분명하면서 20분 동안 재미있는가? -->

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울역 상태창</title>
<style>
  /* 색은 palette.js 가 :root 에 --이름 으로 넣는다. 화면은 1280×720 으로 짜고 창에 맞춰 통째로 늘이고 줄인다.
     play 화면은 구역 다섯 개: hud(위쪽 띠) · me(나) · quest(상태창) · today(오늘 할 일) · board(사다리 · 투자). 간격은 8px. */
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; user-select: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: var(--night0); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: default; }
  b { font-weight: 700; }
  i { font-style: normal; }
  .hide { display: none !important; }
  .screen { position: absolute; inset: 0; }
  .bg { position: absolute; inset: 0; }
  .bg svg { display: block; width: 100%; height: 100%; }

  /* ── 공통 조각 ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 8px; background: var(--night2); border: 1px solid var(--night3); font-size: 17px; font-weight: 700; transition: background .12s, transform .08s; }
  .btn:hover:not(:disabled) { background: var(--night3); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; }
  .btn.main { background: var(--sys); color: var(--ink); border-color: var(--sys); }
  .btn.main:hover:not(:disabled) { background: #8beaff; }
  .btn.warm { background: var(--warm); color: var(--ink); border-color: var(--warm); }
  .btn.up { background: var(--up); color: #fff; border-color: var(--up); }
  .btn.down { background: var(--down); color: #fff; border-color: var(--down); }
  .btn.small { height: 34px; padding: 0 12px; font-size: 15px; }
  .btn.sq { width: 36px; height: 36px; padding: 0; position: relative; }
  .key { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; padding: 0 5px; border-radius: 5px; background: rgba(255,255,255,.12); color: var(--dim); font-size: 14px; font-weight: 700; text-align: center; box-sizing: border-box; }
  .btn.main .key, .btn.warm .key { background: rgba(0,0,0,.18); color: var(--ink); }
  .dim { color: var(--dim); }
  .up { color: var(--up); } .down { color: var(--down); } .gold { color: var(--gold); } .good { color: var(--good); } .bad { color: var(--bad); } .sys { color: var(--sys); } .warm { color: var(--warm); }
  .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 5px; background: var(--sys); transition: width .35s ease-out; }
  .ic { display: inline-block; width: 20px; height: 20px; vertical-align: -4px; flex: none; }
  .ic svg { display: block; width: 100%; height: 100%; }
  .ic.s { width: 16px; height: 16px; vertical-align: -3px; }
  .ic.l { width: 28px; height: 28px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px; background: rgba(11,16,34,.6); border: 1px solid var(--night3); white-space: nowrap; font-size: 14px; box-sizing: border-box; }
  .chip.hot { border-color: var(--gold); color: var(--gold); }
  .chip.go { font-weight: 700; background: rgba(255,209,102,.12); }

  /* ── 구역 틀 ── */
  .zone { position: absolute; box-sizing: border-box; background: var(--night1); border: 1px solid var(--night2); border-radius: 10px; overflow: hidden; }
  .zh { height: 30px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: rgba(255,255,255,.04); border-bottom: 1px solid var(--night2); font-size: 15px; font-weight: 700; white-space: nowrap; }
  .zh .ic { color: var(--sys); }
  .zh .r { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 400; }
  #hud { left: 12px; top: 10px; width: 1256px; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 0; }
  #me { left: 12px; top: 70px; width: 420px; height: 318px; }
  #quest { left: 12px; top: 396px; width: 420px; height: 314px; }
  #today { left: 440px; top: 70px; width: 828px; height: 196px; }
  #board { left: 440px; top: 274px; width: 828px; height: 436px; }

  /* ── hud ── */
  #hud .zh { height: 100%; border-bottom: 0; border-right: 1px solid var(--night2); font-size: 17px; gap: 6px; padding: 0 12px; }
  #hud .zh b { color: var(--warm); }
  .slots { display: flex; gap: 4px; }
  .slots span { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--night3); }
  .slots span svg { width: 20px; height: 20px; }
  .slots span.done { color: var(--dim); opacity: .5; }
  .slots span.now { background: var(--warm); color: var(--ink); }
  #hud .grow { flex: 1; }
  .money { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .money .ic { color: var(--dim); }
  .money b { font-size: 21px; display: inline-block; }
  #cash.bump, #worth.bump { animation: bump .35s; }
  @keyframes bump { 30% { transform: scale(1.18); color: var(--gold); } }
  .goal { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 15px; }
  .goal .ic { color: var(--warm); }
  .goal .bar { width: 110px; }
  .goal .bar > div { background: var(--warm); }
  .goal b { font-size: 18px; color: var(--warm); min-width: 40px; text-align: right; }
  .hbtns { display: flex; gap: 6px; }
  .hbtns .n { position: absolute; right: -5px; top: -5px; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 700; padding: 0 3px; box-sizing: border-box; }

  /* ── me: 사는 곳 그림 + 체력 · 레벨 · 특성 ── */
  #me .scene { position: relative; height: 222px; overflow: hidden; background: var(--night0); }
  #me .scene svg { display: block; width: 100%; height: 100%; }
  .lvb { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; }
  .lvb .ic { color: var(--gold); }
  .xpbar { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .xpbar > i { display: block; height: 100%; background: var(--gold); transition: width .35s; }
  .me-row { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 15px; }
  .me-row .ic { color: var(--good); }
  .me-row .bar { flex: 1; height: 12px; }
  .me-row .bar > div { background: var(--good); }
  .me-row.low .bar > div { background: var(--bad); }
  .me-row.low .ic { color: var(--bad); }
  .me-row b { min-width: 62px; text-align: right; }
  .perks { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-top: 1px solid var(--night2); box-sizing: border-box; }
  .perks .pk { position: relative; width: 24px; height: 24px; border-radius: 6px; background: var(--night2); display: flex; align-items: center; justify-content: center; color: var(--gold); }
  .perks .pk svg { width: 17px; height: 17px; }
  .perks .pk.x2 { box-shadow: 0 0 0 1px var(--gold); } .perks .pk.x3 { box-shadow: 0 0 0 2px var(--gold); }
  .perks .none { color: var(--night3); display: flex; align-items: center; gap: 6px; }

  /* ── quest: 상태창 ── */
  #quest { background: linear-gradient(180deg, rgba(15,58,82,.6), rgba(15,58,82,.3)); border-color: var(--sysDim); box-shadow: 0 0 22px var(--sysGlow), inset 0 0 30px rgba(83,224,255,.06); overflow: visible; border-radius: 4px; }
  #quest .zh { background: rgba(83,224,255,.08); border-bottom-color: var(--sysDim); color: var(--sys); }
  .corner::before, .corner::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid var(--sys); pointer-events: none; }
  .corner::before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; }
  .corner::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }
  #quest.ping { animation: ping .6s; }
  @keyframes ping { 0% { box-shadow: 0 0 0 var(--sysGlow); } 30% { box-shadow: 0 0 46px rgba(83,224,255,.7), inset 0 0 40px rgba(83,224,255,.25); } }
  .q-in { padding: 10px 14px 0; }
  .q-title { font-size: 23px; font-weight: 800; color: #fff; text-shadow: 0 0 14px var(--sysGlow); }
  .q-desc { font-size: 15px; line-height: 1.4; margin-top: 3px; height: 42px; overflow: hidden; }
  .q-prog { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 15px; }
  .q-prog .bar { flex: 1; height: 12px; }
  .q-prog b { white-space: nowrap; }
  .q-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 26px; font-size: 14px; }
  .q-row .rw { display: inline-flex; align-items: center; gap: 5px; color: var(--gold); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-row .near { color: var(--gold); font-weight: 700; animation: blink 1s infinite; white-space: nowrap; }
  @keyframes blink { 50% { opacity: .45; } }
  .q-row button { margin-left: auto; }
  .q-line { height: 1px; background: linear-gradient(90deg, var(--sysDim), transparent); margin: 10px 14px 0; }
  .q-say { margin: 8px 14px 0; height: 40px; font-size: 14px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; transition: color .6s; }
  .q-say.in { animation: say .3s; }
  .q-say.old, .q-say.old.warn, .q-say.old.bad, .q-say.old.good { color: var(--dim); }
  @keyframes say { 0% { opacity: 0; transform: translateY(4px); } }
  .q-say.warn { color: var(--gold); } .q-say.bad { color: var(--bad); } .q-say.good { color: var(--good); }
  .q-due { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; gap: 6px; overflow: hidden; }

  /* ── today: 오늘 할 일 ── */
  .pips { display: inline-flex; gap: 4px; margin-left: 2px; }
  .pips i { width: 8px; height: 8px; border-radius: 4px; background: var(--night3); }
  .pips i.on { background: var(--warm); }
  .cards { display: flex; gap: 8px; height: 150px; padding: 8px; }
  .card { position: relative; flex: 1 1 0; max-width: 190px; min-width: 0; height: 150px; box-sizing: border-box; border-radius: 10px; background: var(--night0); border: 1px solid var(--night2); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px; transition: border-color .12s, transform .08s, background .12s; cursor: pointer; }
  .card.go:hover { border-color: var(--warm); background: var(--night2); transform: translateY(-2px); }
  .card.off { opacity: .5; cursor: default; }
  .card .pic { width: 52px; height: 52px; }
  .card .pic svg { display: block; width: 100%; height: 100%; }
  .card .nm { font-size: 17px; font-weight: 700; margin-top: 1px; }
  .card .st { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .card .st .ic.s { width: 14px; height: 14px; }
  .card .st span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .card .st .pay { color: var(--gold); } .card .st .cost { color: var(--dim); font-weight: 400; font-size: 14px; } .card .st .gain { color: var(--good); font-size: 16px; } .card .st .lack { color: var(--bad); font-size: 14px; }
  .card .key { position: absolute; left: 6px; top: 6px; }
  .card .lv { position: absolute; right: 7px; top: 8px; display: flex; gap: 3px; }
  .card .lv s { width: 7px; height: 7px; border-radius: 2px; background: var(--night3); }
  .card .lv s.on { background: var(--gold); }
  .card .skip { margin-top: auto; height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--night3); font-size: 14px; color: var(--dim); box-sizing: border-box; }
  .card .skip:hover { color: var(--text); border-color: var(--dim); }
  .card.wide { max-width: none; flex-direction: row; justify-content: center; gap: 18px; text-align: left; border-color: var(--warm); font-size: 15px; }
  .card.wide .big { font-size: 22px; font-weight: 800; display: block; }

  /* ── board: 사다리 / 주식 / 코인 ── */
  .tabs { height: 34px; padding: 0 6px; gap: 4px; }
  .tabs button { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 13px; color: var(--dim); font-size: 15px; font-weight: 700; }
  .tabs button .ic { color: inherit; }
  .tabs button.on { background: var(--sysDeep); color: var(--text); }
  .tabs button.on .ic { color: var(--sys); }
  .tabs button.new { color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); animation: blink 1s infinite; }
  .pbody { position: absolute; left: 0; top: 34px; right: 0; bottom: 0; padding: 10px; box-sizing: border-box; }
  /* 사다리 */
  .ladder { display: flex; gap: 8px; height: 100%; }
  .rung { position: relative; flex: 1 1 0; min-width: 0; border-radius: 8px; background: var(--night0); border: 1px solid var(--night2); display: flex; flex-direction: column; overflow: hidden; }
  .rung.here { border-color: var(--sys); box-shadow: 0 0 14px var(--sysGlow); }
  .rung.past { opacity: .45; }
  .rung.far .th { opacity: .55; }
  .rung .th { height: 92px; background: var(--night0); }
  .rung .th svg { display: block; width: 100%; height: 100%; }
  .rung .in { padding: 8px 10px 10px; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .rung .nm { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .rung .nm .ic { color: var(--sys); }
  .rung .rows { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 15px; }
  .rung .rows span { display: flex; align-items: center; gap: 6px; }
  .rung .rows .ic { color: var(--dim); }
  .rung .opens { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
  .rung .opens span { width: 28px; height: 28px; border-radius: 6px; background: var(--night2); display: flex; align-items: center; justify-content: center; color: var(--gold); }
  .rung .opens svg { width: 22px; height: 22px; }
  .rung .foot { margin-top: auto; }
  .rung .foot .btn { width: 100%; padding: 0 4px; }
  .rung .foot .why { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: var(--dim); min-height: 26px; flex-wrap: wrap; }
  .rung .foot .bar { margin-bottom: 6px; }
  .rung .foot .bar > div { background: var(--warm); }
  /* 투자 */
  .newsbox { display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; height: 126px; box-sizing: border-box; overflow: hidden; margin: 0 0 8px; background: var(--night0); border-radius: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.3; }
  .newsbox > div { min-width: 0; }
  .newsbox h4 { margin: 0 0 1px; height: 20px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--dim); font-weight: 700; white-space: nowrap; }
  .nitem { display: flex; gap: 6px; align-items: center; margin-top: 2px; white-space: nowrap; height: 20px; }
  .nitem .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nitem .src { flex: none; height: 20px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px; font-size: 14px; font-weight: 700; background: var(--night3); }
  .nitem .src.official { background: var(--good); color: var(--ink); } .nitem .src.article { background: var(--sysDim); color: #fff; } .nitem .src.rumor { background: var(--stone); }
  .rel { display: inline-flex; gap: 2px; } .rel i { width: 4px; height: 4px; border-radius: 2px; background: currentColor; opacity: .3; } .rel i.on { opacity: 1; }
  .nitem .rep { flex: none; display: inline-flex; align-items: center; gap: 1px; padding: 0 4px; height: 20px; border-radius: 4px; background: rgba(255,255,255,.08); }
  .nitem .em { width: 20px; height: 20px; flex: none; } .nitem .em svg { display: block; width: 100%; height: 100%; }
  .trade { display: grid; grid-template-columns: 250px 1fr; gap: 12px; }
  .alist { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .arow { position: relative; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--night0); border: 1px solid transparent; text-align: left; }
  .arow.on { border-color: var(--sys); }
  .arow .em { flex: none; width: 36px; height: 36px; }
  .arow .em svg { display: block; width: 100%; height: 100%; }
  .arow .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .arow .l1, .arow .l2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .arow .nm { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arow .nm i { font-size: 14px; font-weight: 400; color: var(--dim); margin-left: 4px; }
  .arow .px { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .arow .mine { font-size: 14px; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .arow .chg { font-size: 14px; white-space: nowrap; }
  .arow.flash-up { animation: fup .5s; } .arow.flash-down { animation: fdn .5s; }
  @keyframes fup { 0% { background: rgba(255,93,108,.45); } } @keyframes fdn { 0% { background: rgba(91,140,255,.45); } }
  .tmain { display: flex; flex-direction: column; min-width: 0; position: relative; }
  .thead { display: flex; align-items: baseline; gap: 10px; height: 28px; white-space: nowrap; }
  .thead b { font-size: 20px; } .thead .p { font-size: 20px; font-weight: 700; } .thead .h { font-size: 14px; color: var(--dim); margin-left: auto; display: inline-flex; align-items: center; gap: 5px; align-self: center; }
  .chart { position: relative; height: 116px; margin-top: 4px; border-radius: 8px; background: var(--night0); overflow: hidden; }
  .chart canvas { display: block; width: 100%; height: 100%; }
  .mine-line { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 15px; min-height: 22px; white-space: nowrap; }
  .mine-line b { font-size: 17px; }
  .mine-line span { display: inline-flex; align-items: center; gap: 5px; }
  .order { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  .order > .ic { color: var(--dim); }
  .seg { display: flex; gap: 4px; }
  .seg button { height: 34px; padding: 0 12px; border-radius: 8px; background: var(--night0); border: 1px solid var(--night3); font-size: 15px; font-weight: 700; color: var(--text); }
  .seg button:disabled { opacity: .4; }
  .seg.pick button { color: var(--dim); }
  .seg.pick button.on { background: var(--sysDeep); border-color: var(--sys); color: var(--text); }
  .note { font-size: 14px; line-height: 1.4; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .levform { background: var(--night0); border-radius: 8px; padding: 10px; }
  .levform .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .levform .row > .ic { color: var(--dim); }
  .levform .seg { flex: 1; } .levform .seg button { flex: 1; padding: 0; }
  .pos { margin: 0; font-size: 15px; display: flex; flex-direction: column; gap: 7px; }
  .pos span { display: flex; align-items: center; gap: 8px; } .pos .ic { color: var(--dim); }
  .stamp { position: absolute; right: 40px; top: 400px; padding: 4px 14px; border: 4px solid currentColor; border-radius: 10px; font-size: 34px; font-weight: 900; transform: rotate(-9deg); pointer-events: none; animation: stamp 1.6s forwards; background: rgba(11,16,34,.55); text-align: center; line-height: 1.1; z-index: 3; }
  .stamp i { display: block; font-size: 15px; font-weight: 700; }
  @keyframes stamp { 0% { transform: rotate(-9deg) scale(2.4); opacity: 0; } 12% { transform: rotate(-9deg) scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

  /* ── 겹쳐 뜨는 창 ── */
  #veil { position: absolute; inset: 0; background: rgba(5,7,15,.72); display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; }
  .frame.corner::before, .frame.corner::after { animation: cornerIn .3s ease-out both; }
  @keyframes cornerIn { 0% { width: 0; height: 0; opacity: 0; } 35% { opacity: 1; } 100% { width: 16px; height: 16px; opacity: 1; } }
  .frame > .win { animation: winin .22s .12s both; }
  #veil.arming [data-do="ok"], #veil.arming [data-do="no"] { opacity: .4; }
  .win { position: relative; box-sizing: border-box; background: linear-gradient(180deg, #10283c, #0d1b30); border: 1px solid var(--sysDim); box-shadow: 0 0 40px var(--sysGlow); padding: 22px 26px; animation: winin .22s ease-out; }
