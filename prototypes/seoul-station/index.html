<html lang="ko">
<head>

<title>서울역 상태창</title>
<style>
  /* 픽셀 UI (2026-11-15~): 색은 px.js 가 :root 에 --k · --c … (palette.js 의 PX) 로 넣고, 틀 · 버튼 그림은 --fr-* · --bt-* · --bs-* 로 넣는다.
     글꼴은 둥근모꼴 하나, 글자 크기는 16 · 32 (드물게 48) px. 둥근 모서리 · 그라디언트 · 흐림 · 번지는 그림자 · 반투명 유리는 쓰지 않는다.
     화면은 1280×720 으로 짜고 창에 맞춰 통째로 늘이고 줄인다. 창이 더 크면 점 하나가 화면의 점 정수 개가 되는 배율까지만 키우고(남는 테두리는 같은 바둑판), 더 작으면 그대로 줄인다.
     px.js 가 불려 오지 않아도 읽히게: 틀이 들어갈 자리에는 단색 바탕 · 테두리를 대체값으로 둔다(var(--c, #fff4d6) 처럼).
     play 화면은 구역 다섯 개: hud(위쪽 띠) · me(내 칸) · quest(상태창) · today(오늘) · board(로드맵 · 투자). 간격은 8px.
     그 위에 겹치는 것: veil(창) · fx(뜨는 숫자) · toasts(알림) · coach(첫 판 안내). */
  @font-face { font-family: 'DungGeunMo'; src: url('fonts/DungGeunMo.subset.woff') format('woff'); font-display: block; }
  :root {
    --text: var(--k); --dim: var(--E); --ink: var(--k);
    --gold: var(--O); --warm: var(--O); --good: var(--G); --bad: var(--R); --up: var(--R); --down: var(--B); --sys: var(--B);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--S, #c4ecff) var(--tile-bg, none) 0 0 / 48px 48px; image-rendering: crisp-edges; image-rendering: pixelated; } /* 무대 밖 테두리의 바둑판도 무대와 같은 배율 · 같은 자리 (ui.js 의 fit) */
  body { font-family: 'DungGeunMo', monospace; font-size: 16px; line-height: 20px; color: var(--text); word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; font-smooth: never; font-synthesis: none; text-rendering: optimizeSpeed; user-select: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: var(--S, #c4ecff) var(--tile-bg, none) 0 0 / 48px 48px; overflow: hidden; image-rendering: crisp-edges; image-rendering: pixelated; } /* 물려받는 속성: 틀(border-image) · 무늬 · 그림이 늘어날 때 점이 뭉개지지 않게 */
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; line-height: 20px; }
  button:disabled { cursor: default; }
  b, strong, h1, h2, h3, h4, em { font-weight: normal; font-style: normal; }
  i { font-style: normal; }
  .hide { display: none !important; }
  .screen { position: absolute; inset: 0; }
  .bg { position: absolute; inset: 0; }
  .bg svg { display: block; width: 100%; height: 100%; }
  .zone, .win, .card, .t-box, .e-box { border-color: var(--k, #2b1d2e); background: var(--c, #fff4d6) padding-box; } /* 틀 그림이 없을 때의 대체값 (틀이 있으면 그 밑에 깔려 안 보임) */
  #s-title .bg > img, #s-results .bg > img { display: block; width: 1280px; height: 720px; } /* 타이틀 · 엔딩 배경: 320×180 을 4배 */
  img.px, canvas.px, .px { image-rendering: crisp-edges; image-rendering: pixelated; }

  /* ── 공통 조각: 버튼 (아래에 턱, 누르면 내려앉음) ── */
  .btn { --bt: var(--bt-c); --btd: var(--bt-c-d); --bs: var(--bs-c); --bsd: var(--bs-c-d);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 8px; box-sizing: border-box; white-space: nowrap; color: var(--k);
    border-style: solid; border-color: transparent; border-width: 9px 9px 15px; border-image: var(--bt) 9 9 15 fill / 9px 9px 15px; }
  .btn:active:not(:disabled) { border-width: 15px 9px 9px; border-image: var(--btd) 15 9 9 fill / 15px 9px 9px; }
  .btn:focus-visible { outline: 2px dashed var(--B); outline-offset: 2px; }
  .btn.main { --bt: var(--bt-o); --btd: var(--bt-o-d); --bs: var(--bs-o); --bsd: var(--bs-o-d); }
  .btn.warm { --bt: var(--bt-y); --btd: var(--bt-y-d); --bs: var(--bs-y); --bsd: var(--bs-y-d); }
  .btn.up { --bt: var(--bt-r); --btd: var(--bt-r-d); --bs: var(--bs-r); --bsd: var(--bs-r-d); }
  .btn.down { --bt: var(--bt-b); --btd: var(--bt-b-d); --bs: var(--bs-b); --bsd: var(--bs-b-d); }
  .btn.good { --bt: var(--bt-g); --btd: var(--bt-g-d); --bs: var(--bs-g); --bsd: var(--bs-g-d); }
  .btn:disabled, .btn.lock { --bt: var(--bt-e); --btd: var(--bt-e); --bs: var(--bs-e); --bsd: var(--bs-e); color: var(--E); }
  .btn.small { height: 34px; padding: 0 4px; gap: 4px; border-width: 6px 6px 10px; border-image: var(--bs) 6 6 10 fill / 6px 6px 10px; }
  .btn.small:active:not(:disabled) { border-width: 10px 6px 6px; border-image: var(--bsd) 10 6 6 fill / 10px 6px 6px; }
  .btn.sq { width: 48px; height: 48px; padding: 0; position: relative; border-width: 6px 6px 10px; border-image: var(--bs) 6 6 10 fill / 6px 6px 10px; }
  .btn.sq:active:not(:disabled) { border-width: 10px 6px 6px; border-image: var(--bsd) 10 6 6 fill / 10px 6px 6px; }
  .btn.sq .ic { width: 32px; height: 32px; }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 3px; box-sizing: border-box; border: 3px solid transparent; border-image: var(--fr-key) 3 fill / 3px; color: var(--E); font-size: 16px; line-height: 16px; flex: none; }
  .key .ic { width: 16px; height: 16px; }
  .dim { color: var(--dim); }
  .up { color: var(--up); } .down { color: var(--down); } .gold { color: var(--gold); } .good { color: var(--good); } .bad { color: var(--bad); } .sys { color: var(--sys); } .warm { color: var(--warm); }
  /* 막대: 어두운 홈 + 칸 눈금 + 위 밝은 줄 · 아래 어두운 줄 */
  .bar { position: relative; height: 16px; box-sizing: border-box; border: 2px solid var(--k); background: var(--E); overflow: hidden; }
  .bar > div { height: 100%; background: var(--bf, var(--g)); box-shadow: inset 0 2px 0 var(--bl, var(--h)), inset 0 -2px 0 var(--bd, var(--G)); transition: width .3s steps(5); }
  .bar::after { content: ''; position: absolute; inset: 0; background: var(--tick) repeat-x 0 0 / 12px 100%; pointer-events: none; }
  .bar.gold, .goal .bar, .rung .bar, .n-house .bar { --bf: var(--y); --bl: var(--Y); --bd: var(--o); }
  .ic { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; flex: none; }
  .ic svg, .ic img { display: block; width: 100%; height: 100%; }
  .ic.s { width: 16px; height: 16px; }
  .ic.l { width: 32px; height: 32px; vertical-align: -8px; }
  /* 칩: 글만 있는 딱지(span)와 누르는 칩(button) */
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 2px; box-sizing: border-box; white-space: nowrap; color: var(--k); text-shadow: none;
    border: 6px solid transparent; border-image: var(--fr-chip) 6 fill / 6px; }
  .chip.hot { border-image-source: var(--fr-chipy); }
  button.chip, .chip.go { --bs: var(--bs-c); --bsd: var(--bs-c-d); height: 32px; border-width: 6px 6px 10px; border-image: var(--bs) 6 6 10 fill / 6px 6px 10px; }
  button.chip:active:not(:disabled) { border-width: 10px 6px 6px; border-image: var(--bsd) 10 6 6 fill / 10px 6px 6px; }
  button.chip.hot { --bs: var(--bs-y); --bsd: var(--bs-y-d); }
  button.chip.warmgo { --bs: var(--bs-o); --bsd: var(--bs-o-d); }
  button.chip.off, .chip.off { --bs: var(--bs-e); --bsd: var(--bs-e); color: var(--E); cursor: pointer; }

  /* ── 구역 틀: 크림 패널 + 파란 제목 띠 ── */
  .zone { position: absolute; z-index: 0; box-sizing: border-box; border: 9px solid var(--k, #2b1d2e); border-image: var(--fr-panel) 9 fill / 9px; overflow: hidden; }
  .zh { position: relative; height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; margin: -3px -3px 0; padding: 0 2px; border: 9px solid var(--B, #23449a); border-image: var(--fr-blue) 9 fill / 9px; background: var(--b, #3b6fd8) padding-box; color: var(--w); text-shadow: 0 2px 0 var(--B); white-space: nowrap; }
  .zh .chip, .zh .key, .zh button { text-shadow: none; }
  .zh .r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #hud { left: 6px; top: 4px; width: 1268px; height: 68px; display: flex; align-items: center; gap: 6px; padding: 0 2px; }
  #me { left: 6px; top: 80px; width: 420px; height: 344px; }
  #quest { left: 6px; top: 432px; width: 420px; height: 284px; border-image-source: var(--fr-sys); display: flex; flex-direction: column; }
  #quest > * { flex: none; }
  #today { left: 434px; top: 80px; width: 840px; height: 246px; }
  #board { left: 434px; top: 334px; width: 840px; height: 382px; }

  /* ── hud: 큰 N일째 · 시간대 칩 · 현금 · 순자산 · 다음 목표 · 아이콘 단추 ── */
  #hud .zh { height: auto; margin: 0; padding: 0 2px 0 0; border: 0; border-image: none; background: none; color: var(--k); text-shadow: none; gap: 6px; }
  #hud .zh .ic { width: 32px; height: 32px; vertical-align: 0; }
  #hud .zh b { font-size: 32px; line-height: 32px; color: var(--k); }
  .slots { display: flex; gap: 2px; align-items: center; }
  .slots span { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px; box-sizing: border-box; color: var(--e); }
  .slots span .ic, .slots span svg, .slots span img { width: 16px; height: 16px; display: block; }
  .slots span i { display: none; }
  .slots span.done { color: var(--e); opacity: 1; }
  .slots span.now { color: var(--k); padding: 0 2px; border: 6px solid transparent; border-image: var(--fr-chipy) 6 fill / 6px; }
  .slots span.now i { display: inline; }
  .money { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 2px; box-sizing: border-box; white-space: nowrap; border: 6px solid transparent; border-image: var(--fr-chip) 6 fill / 6px; }
  .money b { display: inline-block; }
  .money i { color: var(--E); }
  .money.gold { border-image-source: var(--fr-chipy); color: var(--k); }
  #cash.bump, #worth.bump { animation: bump .36s steps(3); }
  @keyframes bump { 30% { transform: translateY(-3px); color: var(--O); } }
  .goal { display: flex; align-items: center; gap: 4px; white-space: nowrap; min-width: 0; }
  #hud > .goal { flex: 1 1 0; height: 36px; padding: 0 2px; box-sizing: border-box; overflow: hidden; border: 6px solid transparent; border-image: var(--fr-chip) 6 fill / 6px; } /* 남은 폭을 다 쓰고 그 밖으로는 안 나감 (금액은 길면 "350억"처럼 줄여 씀) */
  #hud > .goal .gn { flex: none; } #hud > .goal .gp { flex: none; }
  #hud > .goal:has(.goal-go) { border: 0; border-image: none; padding: 0; justify-content: center; }
  .goal .gn { color: var(--O); }
  .goal .bar { flex: 1 1 48px; min-width: 24px; max-width: 220px; }
  .goal b { min-width: 32px; text-align: right; }
  /* 금액이 길어 넘치면 한 단계씩 줄인다 (ui.js 의 fitHud). "현금" · "순자산" 이름은 끝까지 남긴다:
     k1 주간 띠의 "고정비" 글자를 뺌(뜻은 title) · 틈 4 → k2 목표 막대를 빼고 % 만 · 시간대 칩을 좁게 → k3 틈 2 → k4 목표 알약의 이름 · 금액을 … 으로 줄임 */
  #hud.k1, #hud.k2 { gap: 4px; } #hud.k1 .wkl, #hud.k2 .wkl, #hud.k3 .wkl, #hud.k4 .wkl { display: none; }
  #hud.k2 .goal .bar, #hud.k3 .goal .bar, #hud.k4 .goal .bar { display: none; } #hud.k2 .goal b, #hud.k3 .goal b, #hud.k4 .goal b { min-width: 0; }
  #hud.k2 .slots span:not(.now), #hud.k3 .slots span:not(.now), #hud.k4 .slots span:not(.now) { padding: 0 1px; }
  #hud.k3, #hud.k4 { gap: 2px; } #hud.k3 .zh, #hud.k4 .zh { gap: 4px; } #hud.k3 .money, #hud.k4 .money { gap: 2px; }
  #hud.k4 > .goal .gn, #hud.k4 > .goal .gp { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .hbtns { display: flex; gap: 4px; flex: none; }
  /* 이번 주 일곱 칸: 지난 날 · 오늘 · 남은 날, 일요일 칸은 고정비 (고정비가 있는 주만) */
  .wk { display: flex; align-items: center; gap: 2px; margin-left: 2px; }
  .wk i { width: 6px; height: 16px; box-sizing: border-box; border: 2px solid var(--k); background: var(--c); }
  .wk i.past { background: var(--e); border-color: var(--E); }
  .wk i.now { background: var(--o); }
  .wk .bill { width: 20px; height: 20px; color: var(--E); display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .wk .bill svg, .wk .bill img { width: 16px; height: 16px; display: block; }
  .wk .bill.due { color: var(--O); } .wk .bill.now { color: var(--k); background: var(--y); outline: 2px solid var(--k); outline-offset: -2px; }
  .wkl { margin-left: 2px; color: var(--E); } .wkl.due { color: var(--O); }
  .goal-go { animation: bob 1s steps(1) infinite; } /* 흐려지면 꺼진 단추로 읽혀서 밝기는 그대로, 위아래로만 */
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .hbtns .n { position: absolute; right: -8px; top: -10px; min-width: 20px; height: 20px; line-height: 16px; padding: 0 2px; box-sizing: border-box; border: 2px solid var(--k); background: var(--y); color: var(--k); }

  /* ── me: 사는 곳 그림 + 체력 · 레벨 · 특성 ── */
  #me .zh .place { color: var(--w); }
  #me .zh .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; height: 24px; border-width: 4px; border-image: var(--sc-y) 4 fill / 4px; padding: 0 2px; line-height: 16px; display: inline-block; max-width: 150px; }
  .lvb { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--w); }
  .xpbar { display: inline-block; position: relative; width: 56px; height: 14px; box-sizing: border-box; border: 2px solid var(--k); background: var(--E); overflow: hidden; }
  .xpbar > i { display: block; height: 100%; background: var(--l); box-shadow: inset 0 2px 0 var(--S); transition: width .3s steps(5); }
  #me .scene { position: relative; margin: 2px auto 0; width: 396px; box-sizing: border-box; overflow: hidden; border: 6px solid transparent; border-image: var(--fr-well) 6 fill / 6px; background: var(--k); }
  #me .scene > svg, #me .scene > img { position: absolute; left: 0; top: var(--sy, 0); display: block; width: 384px; height: 216px; }
  .me-row { height: 28px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 4px; white-space: nowrap; }
  .me-row .bar { flex: 1; --bf: var(--r); --bl: var(--w); --bd: var(--R); }
  .me-row.low .bar > div { animation: blink 1s steps(1) infinite; }
  .me-row.hp b { min-width: 72px; text-align: right; color: var(--R); }
  /* 사업 줄 · 대출 줄: 생긴 뒤에만 (그만큼 그림 칸이 낮아지고, 그림은 3배 그대로 위아래가 잘린다) */
  .me-row.biz, .me-row.loan { height: 32px; margin-top: 2px; border-top: 2px solid var(--d); gap: 6px; } /* 높이 32 = 테두리 2 포함 (줄 하나가 그림 칸을 34px 줄인다) */
  .me-row.loan .lab { color: var(--E); } .me-row.loan .dim { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .me-row .r { margin-left: auto; flex: none; }
  .perks { height: 32px; display: flex; align-items: center; gap: 4px; padding: 0 4px; margin-top: 2px; box-sizing: border-box; border-top: 2px solid var(--d); }
  .perks > .pl { flex: none; color: var(--E); } /* "특성" 이름표 */
  .perks > .pks { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 4px; overflow: hidden; } /* 특성 칸이 줄어들고, 로드맵 단추는 늘 보임 */
  .perks .more { flex: none; height: 24px; line-height: 20px; padding: 0 2px; box-sizing: border-box; border: 2px solid var(--k); background: var(--c); color: var(--k); cursor: pointer; } /* 다 못 넣은 특성 수 (누르면 전부) */
  .perks .pk { cursor: pointer; position: relative; width: 24px; height: 24px; box-sizing: border-box; border: 2px solid var(--k); background: var(--Y); display: flex; align-items: center; justify-content: center; flex: none; }
  .perks .pk svg, .perks .pk img { width: 16px; height: 16px; display: block; }
  .perks .pk.x2 { outline: 2px solid var(--o); } .perks .pk.x3 { outline: 2px solid var(--O); outline-offset: 2px; }
  .perks .pk.aug { background: var(--c); border-color: var(--R); }
  .perks .none { color: var(--e); display: flex; align-items: center; gap: 4px; }
  .perks .mapbtn { margin-left: auto; flex: none; }
  .perks.many .pks { gap: 2px; } .perks.many .pk { width: 20px; height: 20px; } /* 특성이 많으면 칸을 줄이고, 그래도 넘치면 "+n" (전부는 누르면) */

  /* ── quest: 상태창 (하늘 쪽지) ── */
  #quest.ping { animation: ping .5s step-end; }
  @keyframes ping { 0%, 60% { border-image-source: var(--fr-cardq); } 61%, 100% { border-image-source: var(--fr-sys); } } /* 자리는 그대로, 틀 색만 잠깐 금빛. step-end: 그림 둘을 섞지 않고 딱 바뀜 (steps(2)는 가운데에서 두 틀을 반반 섞어 연두로 보였다) */
  .q-in { padding: 4px 6px 0; }
  .q-title { font-size: 32px; line-height: 32px; color: var(--B); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-desc { margin-top: 2px; line-height: 20px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; max-height: 80px; } /* 줄 수는 ui.js 의 fitQuest 가 정한다: 자리가 있으면 다 보이고, 모자라면 줄임 (전부는 title) */
  .q-prog { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .q-prog .bar { flex: 1; --bf: var(--g); --bl: var(--h); --bd: var(--G); }
